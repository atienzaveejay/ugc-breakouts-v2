<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>UGCB onboarding rethink (app)</title>
<link rel="preconnect" href="https://fonts.bunny.net">
<link href="https://fonts.bunny.net/css?family=plus-jakarta-sans:400,500,600,700,800|jetbrains-mono:500,600&display=swap" rel="stylesheet">
<!-- live.css = the live ugcbreakouts.com stylesheet as captured in ugcb-onboarding-live.html (25 Nov 2026). Untouched. -->
<link rel="stylesheet" href="live.css">
<style>
/* Only the new pieces. Everything else uses live classes (obf-*, hm2-*, hm-*, lb-*, tb-*, pnav, tabs, b, b1, b2, list, toast). */
html,body{margin:0}
.bk .bk-main{min-height:100dvh}
.bk.has-nav .bk-main{padding-bottom:calc(var(--navh) + 12px)}
.rt-pg{display:flex;flex-direction:column;gap:18px;padding:6px 16px 28px}
.rt-top{display:flex;align-items:center;justify-content:space-between;padding:12px 16px 4px;min-height:52px}
.rt-top .av{width:36px;height:36px;font-size:14px;border:0;cursor:pointer;font-family:var(--sans)}
.rt-h1{margin:0;font-size:26px;font-weight:800;letter-spacing:-.03em;line-height:1.1}
.rt-h2{margin:0;font-size:19px;font-weight:800;letter-spacing:-.02em;line-height:1.2}
.rt-sub{margin:4px 0 0;color:var(--mid);font-size:14px;line-height:1.45}
.rt-back{display:inline-flex;align-items:center;gap:4px;align-self:flex-start;background:0 0;border:0;padding:6px 0;margin:-4px 0 -8px;font:700 14px var(--sans);color:var(--mid);cursor:pointer}
.rt-back svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}

/* search running / ready block */
.rt-wait{background:#fff;border:1px solid var(--hair);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px;box-shadow:0 1px 2px #1713120f,0 2px 8px #1713120d}
.rt-wait-h{display:flex;align-items:center;gap:10px}
.rt-wait-h b{flex:1;min-width:0;font-size:16px;font-weight:750;letter-spacing:-.015em;line-height:1.3}
.rt-t{font:600 13px var(--sans);color:var(--mid);font-variant-numeric:tabular-nums}
.rt-prog{height:4px;border-radius:2px;background:var(--pill);overflow:hidden}
.rt-prog i{display:block;height:100%;width:0;background:var(--teal);transition:width 1s linear}
.rt-wait p{margin:0;color:var(--mid);font-size:14px;line-height:1.45}
.rt-wait p b{color:var(--ink)}
.rt-wait.ready{border-color:var(--ink)}
.rt-ok{width:22px;height:22px;border-radius:50%;background:var(--teal);color:#fff;display:grid;place-items:center;flex:none}
.rt-ok svg{width:13px;height:13px;fill:none;stroke:currentColor;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}

/* status strip on the Breakouts page */
.rt-strip{position:sticky;top:0;z-index:20;margin:0 -16px;padding:10px 16px;background:var(--paper);border-bottom:1px solid var(--hair);display:flex;flex-direction:column;gap:8px}
.rt-strip .row{display:flex;align-items:center;gap:10px}
.rt-strip .row span.tx{flex:1;min-width:0;font-size:13.5px;line-height:1.3}
.rt-strip .row span.tx b{display:block;font-weight:700}
.rt-strip .row span.tx small{color:var(--mid);font-size:12.5px}
.rt-strip.ready{background:var(--ink);color:#fff;border-bottom-color:var(--ink)}
.rt-strip.ready small{color:#cfc5be}
.rt-strip .b{min-height:38px;padding:0 14px;font-size:14px;border-radius:10px;flex:none}

/* checklist */
.rt-ck{background:#fff;border:1px solid var(--hair);border-radius:14px;overflow:hidden}
.rt-ck-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding:14px 16px 10px}
.rt-ck-h h2{margin:0;font-size:17px;font-weight:800;letter-spacing:-.02em}
.rt-ck-h span{font-size:13px;color:var(--mid);font-weight:600;font-variant-numeric:tabular-nums}
.rt-seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;padding:0 16px 8px}
.rt-seg i{height:4px;border-radius:2px;background:var(--pill)}
.rt-seg i.on{background:var(--teal)}
.rt-ck ol{list-style:none;margin:0;padding:0}
.rt-task{width:100%;display:flex;align-items:center;gap:12px;padding:11px 16px;border:0;border-top:1px solid var(--hair);background:#fff;text-align:left;font-family:var(--sans);color:var(--ink)}
button.rt-task{cursor:pointer}
button.rt-task:hover{background:#fcfaf8}
.rt-task .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.rt-task .tx b{font-size:15px;font-weight:700}
.rt-task .tx small{font-size:12.5px;color:var(--mid)}
.rt-task.done .tx b{color:var(--mid);font-weight:600}
.rt-dot{width:22px;height:22px;border-radius:50%;border:2px solid #d6cdc5;flex:none;display:grid;place-items:center}
.rt-task.done .rt-dot{background:var(--teal);border-color:var(--teal);color:#fff}
.rt-dot svg{width:12px;height:12px;fill:none;stroke:currentColor;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.rt-task.run .rt-dot{border:0}
.rt-task .chev{width:16px;height:16px;color:#9a908b;flex:none;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.rt-start{flex:none;min-height:34px;padding:0 12px;border-radius:9px;background:var(--coral-d);color:#fff;font:700 13.5px var(--sans);display:grid;place-items:center}
.rt-alldone{padding:12px 16px 14px;border-top:1px solid var(--hair);font-size:14px;color:var(--mid)}

/* notification dot for features not tried yet (Ivan, 27 Nov call: "unread" style) */
.rt-glow{position:relative;overflow:visible}
.rt-glow::after{content:"";position:absolute;top:-4px;right:-4px;width:11px;height:11px;border-radius:50%;background:#e5484d;box-shadow:0 0 0 2px #fff;pointer-events:none}
.pnav-i .rt-ic{display:grid;place-items:center;width:34px;height:28px;border-radius:9px}
.pnav-i .rt-ic.rt-glow::after{top:-1px;right:2px}
.rt-ready{background:var(--teal)!important;border-color:var(--teal)!important;color:#fff!important}
.rt-ready svg{fill:none!important;stroke:currentColor;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;width:16px;height:16px}

/* breakout cards */
.rt-list{display:flex;flex-direction:column;gap:16px}
.rt-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.rt-card{background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 1px 2px #1713120f,0 2px 8px #1713120d;display:flex;flex-direction:column}
.rt-th{position:relative;aspect-ratio:1/1;background:#ddd center/cover no-repeat}
.rt-grid .rt-th{aspect-ratio:3/4}
.rt-th:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.18) 0,transparent 28%,transparent 52%,rgba(0,0,0,.62) 100%)}
.rt-th>*{position:absolute;z-index:1}
.rt-rank{top:10px;left:10px;min-width:28px;height:28px;padding:0 8px;border-radius:8px;background:var(--ink);color:#fff;font:800 14px var(--sans);display:grid;place-items:center}
.rt-save{top:8px;right:8px;width:34px;height:34px;border-radius:9px;background:rgba(23,19,18,.55);color:#fff;border:0;display:grid;place-items:center}
.rt-save svg,.rt-play svg{fill:none;stroke:currentColor;stroke-width:2;stroke-linejoin:round;width:17px;height:17px}
.rt-play{top:50%;left:50%;transform:translate(-50%,-50%);width:52px;height:52px;border-radius:50%;background:rgba(23,19,18,.72);color:#fff;display:grid;place-items:center}
.rt-play svg{fill:#fff;stroke:none;width:20px;height:20px;margin-left:3px}
.rt-grid .rt-play{width:40px;height:40px}.rt-grid .rt-play svg{width:15px;height:15px}
.rt-cap{left:12px;right:12px;bottom:12px;margin:0;color:#fff;font-weight:750;font-size:17px;line-height:1.25;text-shadow:0 1px 3px rgba(0,0,0,.5);letter-spacing:-.01em}
.rt-grid .rt-cap{font-size:13.5px;left:9px;right:9px;bottom:30px}
.rt-len{right:10px;bottom:12px;font:700 12px var(--sans);color:#fff;background:rgba(23,19,18,.6);padding:3px 6px;border-radius:6px}
.rt-card .rt-cap{right:60px}
.rt-grid .rt-len{bottom:8px;right:8px}
.rt-grid .rt-card .rt-cap{right:9px}
.rt-meta{padding:12px 14px 14px;display:flex;flex-direction:column;gap:6px}
.rt-grid .rt-meta{padding:9px 10px 11px;gap:4px}
.rt-stat{display:flex;align-items:baseline;gap:8px;font-size:14px;color:var(--mid);flex-wrap:wrap}
.rt-stat b{color:var(--ink);font-size:17px;font-weight:800;letter-spacing:-.01em}
.rt-x{color:var(--teal);font-weight:800}
.rt-grid .rt-stat{font-size:12.5px;gap:6px}.rt-grid .rt-stat b{font-size:14.5px}
.rt-who{font-size:13px;color:var(--mid);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.rt-grid .rt-who{font-size:12px}
.rt-blur{filter:blur(4.5px);user-select:none;color:var(--ink);font-weight:600}
.rt-prod{font-size:14px;color:var(--ink);font-weight:600}
.rt-card .b{min-height:46px;font-size:15px;margin-top:6px}
.rt-card .b2{color:var(--teal);border-color:#b9dfe0;background:#f3fafa}
.rt-card .b2 svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round}

/* next-step note */
.rt-next{display:flex;gap:12px;align-items:flex-start;background:var(--teal-soft);border-radius:12px;padding:12px 14px;font-size:14px;line-height:1.45}
.rt-next b{display:block}
.rt-next .rt-ok{margin-top:1px}

/* same-as-live stand-in */
.rt-same{background:#fff;border:1px dashed #d6cdc5;border-radius:14px;padding:16px;font-size:14px;color:var(--mid);line-height:1.5}
.rt-same b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}
.rt-same a{color:var(--teal);font-weight:700}

/* library */
.lb-tabs button svg{width:12px;height:12px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.lb-sf svg,.hm-li svg{fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.hm-li>svg{width:16px;height:16px}
.rt-empty{font-size:14px;color:var(--mid)}
.rt-meterline{font-size:13px;color:var(--mid);margin:-6px 2px 0}
.rt-lockwrap{position:relative;min-height:520px}
.rt-lockwrap .tb-lockcard{top:40px}
.rt-lockwrap .tb-lockcard .b{width:100%}

.toast{position:fixed}
.rt-dock{position:fixed;left:12px;right:12px;bottom:calc(var(--navh) + 10px + env(safe-area-inset-bottom));z-index:15;max-width:536px;margin:0 auto;background:#fff;border:1px solid var(--hair);border-radius:14px;padding:10px 10px 10px 14px;display:flex;align-items:center;gap:12px;box-shadow:0 10px 28px -10px #17131240}
.rt-dock .tx{flex:1;min-width:0;font-size:13.5px;line-height:1.35;color:var(--mid)}
.rt-dock .tx b{display:block;color:var(--ink);font-size:14.5px}
.rt-dock .b{min-height:42px;padding:0 14px;font-size:14.5px;border-radius:11px;flex:none}
.has-dock .rt-pg{padding-bottom:96px}
</style>
</head>
<body class="bk-body">
<div class="bk" id="bk"><main class="bk-main"><div id="app"></div></main><div id="navslot"></div><div id="toastslot"></div></div>
<script src="data.js"></script>
<script>
(function(){
/* Prototype of Ivan's 27 Nov onboarding notes. Live onboarding steps 2 to 7 are the live flow.js (25 Nov capture) as is. */
var IMG = "../top-breakouts/assets/";
var SEARCH_SECS = 90;           /* live note: "It takes 1 to 2 minutes" */
var WAIT_AFTER_BROWSE = 15;     /* prototype only: the search finishes 15 s after she opens Breakouts */

function fresh(){ return { scr:"q1", step:1, q:"", search:null, vals:{}, others:{}, tt:"intro", handle:"", left:3, err:null, nf:false,
  tasks:{ account:1, setup:0, search:0, script:0, analyze:0, connect:0 }, seen:false, lib:"searches", back:null }; }
var S = fresh();

function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function $(s){ return document.querySelector(s); }
var IC = {
  search:'<svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle class="i" cx="11" cy="11" r="7"></circle><path class="i" d="m20 20-3.5-3.5"></path></svg>',
  arrow:'<svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path class="i" d="M5 12h14M13 6l6 6-6 6"></path></svg>',
  info:'<svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path class="i" d="M12 11v6M12 7.5h.01" stroke-width="2.6"></path></svg>',
  back:'<svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path class="i" d="M15 5l-7 7 7 7"></path></svg>',
  tiktok:'<svg class="obf-tt-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M14 3v11.5a3.5 3.5 0 1 1-3.5-3.5"></path><path d="M14 3c.4 2.6 2.2 4.4 5 4.7"></path></svg>',
  trend:'<svg viewBox="0 0 24 24"><path d="M4 16l5-5 4 4 7-7M15 8h5v5"></path></svg>',
  pen:'<svg viewBox="0 0 24 24"><path d="M15 5l4 4L8 20H4v-4L15 5z"></path></svg>',
  home:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10.5 12 4l8 6.5V20h-5v-6H9v6H4z"></path></svg>',
  flame:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21c-3.9 0-6.5-2.6-6.5-6.2 0-3.4 2.4-5.4 3.6-8.3.3 2 1.4 3.2 2.6 3.6C12.5 7.4 13.6 5 13.2 3c3.4 2.4 5.3 6.2 5.3 10.3 0 4.4-2.7 7.7-6.5 7.7z"></path></svg>',
  pen2:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l4 4L8 20H4v-4L15 5z"></path></svg>',
  mark:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 4h12v17l-6-4-6 4z"></path></svg>',
  check:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>',
  chev:'<svg class="chev" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>',
  play:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.5v15L19.5 12z"></path></svg>',
  lock:'<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11V8a4 4 0 0 1 8 0v3"></path></svg>',
  scan:'<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"></circle><path d="m20 20-4-4"></path></svg>'
};
var PERKS = [
  ["trend","Your profile check","Your usual views, your breakouts and your best day to post, as a short story you can share."],
  ["pen","Scripts that sound like you","Built from what already works on your account: your hooks, your length, your style."],
  ["search","Breakouts for accounts your size","So the ideas fit where you are now."]
];
var OUT_MSG = "That’s all the usernames we can check for now. Skip for now and connect your TikTok from Home later.";

/* ---------- search clock ---------- */
function mmss(s){ s = Math.max(0, Math.floor(s)); return Math.floor(s/60) + ":" + String(s%60).padStart(2,"0"); }
function el(){ return S.search ? (Date.now() - S.search.t0)/1000 : 0; }
function done(){ return !!S.search && el() >= SEARCH_SECS; }
function setFor(q){
  var k = String(q).toLowerCase(), map = [["review","Product review"],["unbox","Unboxing"],["grwm","GRWM"],["get ready","GRWM"],["before","Before and after"],["after","Before and after"],["day in","Day in my life"],["story","Storytime"],["lip","Lip liner"],["tan","Self-tanner"],["band","Resistance bands"],["workout","Resistance bands"],["closet","Closet organizer"],["organiz","Closet organizer"]];
  for (var i = 0; i < map.length; i++) if (k.indexOf(map[i][0]) >= 0) return map[i][1];
  return CH[q] ? q : "Product review"; /* typed queries with no hand-picked set fall back to a sample set */
}
function startSearch(q){ if (!S.search) S.search = { q:q, set:setFor(q), t0:Date.now() }; }

/* ---------- live onboarding (flow.js, 25 Nov), unchanged except the chips ---------- */
function pill(){
  if (!S.search) return "";
  var t = el(), run = t < SEARCH_SECS;
  return '<span class="obf-pill' + (run ? "" : " done") + '" role="status"><span class="obf-spin" aria-hidden="true"></span><span id="pilltxt">' +
    (run ? "Searching ‘" + esc(S.search.q) + "’ · " + mmss(t) : "Results ready for ‘" + esc(S.search.q) + "’") + "</span></span>";
}
function obTop(){
  var n = D.stepCount, e = S.step, h = '<header class="obf-top">' +
    (e === 1 ? '<span class="lp-logo"><span class="ugc-brand" aria-label="UGC Breakouts" role="img"><span class="ugc-brand-dot" aria-hidden="true"></span><span aria-hidden="true">UGC <b>Breakouts</b></span></span></span>'
      : '<button type="button" class="obf-back" aria-label="Back" data-a="back">' + IC.back + "</button>") +
    '<span class="obf-count">' + e + " of " + n + (e === n ? '<b class="obf-last"> · Last step</b>' : "") + "</span></header>";
  h += '<div class="obf-bar" aria-hidden="true">';
  for (var i = 0; i < n; i++) h += '<i class="' + (i < e ? "on" : "") + '"></i>';
  return h + "</div>";
}
function step1(){
  var ok = S.q.trim().length >= 2, h = '<form class="obf-form" data-f="search"><div class="obf-q"><span class="obf-hi">Hi Maya</span><h1 class="lp-h1 obf-title">What are you filming next?</h1><p class="lp-lede">A product, a format or a #hashtag. Your first search starts right away.</p></div>';
  h += '<div class="obf-body obf-body-q1"><div class="obf-field">' + IC.search + '<input id="q" value="' + esc(S.q) + '" placeholder="Product or #hashtag" autocomplete="off" maxlength="120" aria-label="What are you filming next?"><button type="submit" class="obf-go" aria-label="Start search"' + (ok ? "" : " disabled") + ">" + IC.arrow + "</button></div>";
  h += '<div class="obf-or"><span>or tap an idea</span></div>';
  Object.keys(D.ideas).forEach(function(g){
    h += '<div class="obf-group"><span class="obf-label">' + esc(g) + '</span><div class="obf-chips">' +
      D.ideas[g].map(function(c){ return '<button type="button" class="obf-chip' + (S.q === c ? " on" : "") + '" data-idea="' + esc(c) + '">' + esc(c) + "</button>"; }).join("") + "</div></div>";
  });
  var m = D.meter, used = S.search ? 1 : 0;
  h += '<div class="obf-note">' + IC.info + "<div><b>This is search " + Math.min(m.next + used, m.limit) + " of " + m.limit + " free searches</b>It takes 1 to 2 minutes. Answer 5 quick questions while we scan TikTok.</div></div></div>";
  return h + '<div class="obf-foot"><button type="submit" class="lp-btn lp-btn-p"' + (ok ? "" : " disabled") + ">Start my search</button></div></form>";
}
function hasOther(q){ return q.options.indexOf(D.other) >= 0; }
function val(q){ var v = S.vals[q.column]; return q.max > 1 ? (v || []) : (v == null ? null : v); }
function picked(q, o){ var v = val(q); return q.max > 1 ? v.indexOf(o) >= 0 : v === o; }
function answered(q){ return q.max > 1 ? val(q).length > 0 : !!val(q); }
function stepQ(){
  var qs = D.questions[S.step] || [], one = qs.length === 1, head = D.pageTitles[S.step];
  var title = one ? qs[0].title : head[0], lede = one ? qs[0].lede : head[1];
  var h = '<div class="obf-q"><h1 class="lp-h1 obf-title">' + esc(title) + "</h1>" + (lede ? '<p class="lp-lede">' + esc(lede) + "</p>" : "") + "</div>";
  h += '<div class="obf-body' + (one ? "" : " obf-multi") + '">';
  qs.forEach(function(q){
    h += '<section class="obf-sec" aria-label="' + esc(q.title) + '">';
    if (!one) h += '<div class="obf-sec-h"><h2>' + esc(q.title) + (q.required ? '<span class="obf-req" aria-label="required"> *</span>' : "") + "</h2>" + (q.lede ? "<small>" + esc(q.lede) + "</small>" : "") + "</div>";
    if (q.max > 1) {
      var full = val(q).length >= q.max;
      h += '<div class="obf-chips obf-chips-lg">' + q.options.map(function(o){
        var on = picked(q, o);
        return '<button type="button" class="obf-chip' + (on ? " on" : "") + '" aria-pressed="' + on + '"' + (!on && full ? " disabled" : "") + ' data-col="' + q.column + '" data-opt="' + esc(o) + '">' + esc(o) + "</button>";
      }).join("") + "</div>";
    } else {
      h += '<div class="obf-opts" role="radiogroup" aria-label="' + esc(q.title) + '">' + q.options.map(function(o){
        var on = picked(q, o);
        return '<button type="button" role="radio" aria-checked="' + on + '" class="obf-opt' + (on ? " on" : "") + '" data-col="' + q.column + '" data-opt="' + esc(o) + '"><span class="obf-rd" aria-hidden="true"></span><span>' + esc(o) + "</span></button>";
      }).join("") + "</div>";
    }
    if (hasOther(q) && picked(q, D.other)) {
      var w = q.column === "wont_do";
      h += '<input class="obf-other" data-other="' + q.column + '" value="' + esc(S.others[q.column] || "") + '" placeholder="' + (w ? "What else won’t you do?" : "Type your own") + '" maxlength="' + (w ? D.noteMax : D.otherMax) + '" aria-label="' + esc(q.title) + ' Other">';
    }
    h += "</section>";
  });
  h += "</div>";

function lookUp(){
  var hd = S.handle.trim().replace(/^@+/, "");
  if (hd.length < 2 || S.tt === "loading") return;
  if (S.left <= 0) { S.err = OUT_MSG; render(); return; }
  S.handle = hd; S.err = null; S.tt = "loading"; S.left -= 1; render();
  setTimeout(function(){ if (S.tt !== "loading") return; S.nf = /private/i.test(hd); S.tt = /private|fail/i.test(hd) ? "failed" : "preview"; render(); }, 1800);
}
document.addEventListener("input", function(ev){
  var t = ev.target;
  if (t.id === "q") { S.q = t.value; render("q"); }
  else if (t.id === "tth") { S.handle = t.value.replace(/^@+/, ""); S.err = null; render("tth"); }
  else if (t.dataset.other) S.others[t.dataset.other] = t.value;
});
document.addEventListener("submit", function(ev){
  ev.preventDefault();
  var f = ev.target.dataset.f;
  if (f === "search") { if (S.q.trim().length >= 2) { startSearch(S.q.trim()); goStep(2); } }
  else if (f === "tt") { if (S.tt === "input") lookUp(); else if (S.tt === "preview" || S.tt === "failed") finishOnboarding(true); }
});
document.addEventListener("click", function(ev){
  var b = ev.target.closest("button,[data-go]"); if (!b || b.disabled) return;
  if (b.dataset.toast) { toast(b.dataset.toast); return; }
  if (b.dataset.go) { if (b.dataset.go === "connect") { S.tt = "intro"; } if (b.dataset.go === "q1") { toast("Setup questions run right after the first search"); return; } go(b.dataset.go); return; }
  if (b.dataset.lib) { S.lib = b.dataset.lib; render(); return; }
  if (b.dataset.idea) { S.q = b.dataset.idea; render(); return; }
  if (b.dataset.col) {
    var q = (D.questions[S.step] || []).filter(function(x){ return x.column === b.dataset.col; })[0], o = b.dataset.opt, qs = D.questions[S.step];
    if (q.max > 1) { var v = val(q).slice(), i = v.indexOf(o); if (i >= 0) v.splice(i, 1); else if (v.length < q.max) v.push(o); S.vals[q.column] = v; render(); }
    else if (qs.length === 1 && !hasOther(q)) { S.vals[q.column] = o; render(); setTimeout(function(){ goStep(S.step + 1); }, 250); }
    else { S.vals[q.column] = S.vals[q.column] === o ? null : o; render(); }
    return;
  }
  var a = b.dataset.a;
  if (a === "back") { if (S.step === 7 && S.tt !== "intro") S.tt = "intro"; if (S.step - 1 <= 1) { S.scr = "q1"; render(); } else goStep(S.step - 1); }
  else if (a === "next") goStep(S.step + 1);
  else if (a === "skip") { (D.questions[S.step] || []).forEach(function(q){ S.vals[q.column] = q.max > 1 ? [] : null; S.others[q.column] = ""; }); goStep(S.step + 1); }
  else if (a === "ttopen") { S.tt = "input"; render("tth"); }
  else if (a === "change") { S.tt = "input"; S.err = null; render("tth"); }
  else if (a === "finish") { if (S.scr === "connect") go("home"); else finishOnboarding(false); }
  else if (a === "analyze") { S.ai = +b.dataset.i || 0; go("analyze"); }
});

/* review jumps: from the shell (postMessage) or a #hash when app.html is opened on its own */
function jump(id){
  var q = "Product review";
  S = fresh();
  var past = function(){ startSearch(q); S.search.t0 -= (SEARCH_SECS + 5) * 1000; S.search.fired = true; S.tasks.search = 1; S.tasks.setup = 1; };
  var running = function(sec){ startSearch(q); S.search.t0 -= sec * 1000; S.tasks.setup = 1; };
  if (id === "q1") { S.scr = "q1"; }
  else if (id === "q1-picked") { S.scr = "q1"; S.q = q; }
  else if (/^ob[2-7]$/.test(id)) { startSearch(q); S.scr = "ob"; S.step = +id.slice(2); }
  else if (id === "home-run") { running(52); S.scr = "home"; }
  else if (id === "browse-run") { running(60); S.scr = "browse"; }
  else if (id === "browse-ready") { past(); S.scr = "browse"; }
  else if (id === "home-ready") { past(); S.scr = "home"; }
  else if (id === "results") { past(); S.scr = "results"; }
  else if (id === "results-analyzed") { past(); S.seen = true; S.tasks.analyze = 1; S.ai = 0; S.scr = "results"; }
  else if (id === "home-after") { past(); S.seen = true; S.tasks.analyze = 1; S.scr = "home"; }
  else if (id === "analyze") { past(); S.seen = true; S.scr = "analyze"; }
  else if (id === "library") { past(); S.seen = true; S.scr = "library"; S.lib = "searches"; }
  else if (id === "library-locked") { past(); S.seen = true; S.scr = "library"; S.lib = "saved"; }
  else if (id === "home-done") { past(); S.seen = true; S.tasks.analyze = 1; S.tasks.script = 1; S.tasks.connect = 1; S.scr = "home"; }
  else { S.scr = "q1"; }
  render(); window.scrollTo(0, 0);
}
window.addEventListener("message", function(e){ if (e.data && e.data.jump) jump(e.data.jump); });
if (location.hash.length > 1) jump(location.hash.slice(1)); else render();
})();
</script>
