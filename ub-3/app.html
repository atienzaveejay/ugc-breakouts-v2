<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>UGC Breakouts 3.0</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
:root{
  --ground:#DCE4E3; --surface:#EEF3F2; --wink:#12201F; --wmuted:#4F5E5C; --wline:#C2CECC; --hover:#E3EBEA;
  --acc:#0B6F73; --t-ivan:#5B3FB0; --t-ivan-bg:#E4DDF6; --t-ask:#A8243A; --t-ask-bg:#F5D9DD; --t-bb:#7A4E00; --t-bb-bg:#F1E3C4;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --sans:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#0F1616; --surface:#172121; --wink:#E3ECEB; --wmuted:#98A8A6; --wline:#2B3A39; --hover:#1F2B2B;
    --acc:#5ED6D9; --t-ivan:#C3B1FF; --t-ivan-bg:#2B2447; --t-ask:#FF97A2; --t-ask-bg:#40202A; --t-bb:#E8BE62; --t-bb-bg:#3A2E14;
  }
}
:root[data-theme="dark"]{
  --ground:#0F1616; --surface:#172121; --wink:#E3ECEB; --wmuted:#98A8A6; --wline:#2B3A39; --hover:#1F2B2B;
  --acc:#5ED6D9; --t-ivan:#C3B1FF; --t-ivan-bg:#2B2447; --t-ask:#FF97A2; --t-ask-bg:#40202A; --t-bb:#E8BE62; --t-bb-bg:#3A2E14;
}
[hidden]{display:none!important}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0}
body{background:var(--ground);color:var(--wink);font-family:var(--sans);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
.i{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.i.f{fill:currentColor;stroke:none}

/* ---------- shell ---------- */
.shell{display:grid;grid-template-columns:250px minmax(0,1fr);min-height:100vh}
.rail{background:var(--surface);border-right:1px solid var(--wline);height:100vh;position:sticky;top:0;overflow-y:auto;padding:22px 12px 28px;display:flex;flex-direction:column;gap:16px}
.brand{padding:0 8px}
.kicker{font-family:var(--mono);font-size:11.5px;color:var(--acc);margin:0 0 6px}
.brand h1{margin:0;font-size:24px;line-height:1;letter-spacing:-.045em;font-weight:800}
.brand h1 b{color:var(--acc)}
#groups{display:flex;flex-direction:column;gap:16px}
.grp{display:flex;flex-direction:column;gap:2px}
.grp h2{font-family:var(--mono);font-size:10.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--wmuted);margin:0 0 4px;padding:0 10px}
.grp button{display:flex;gap:10px;align-items:baseline;text-align:left;border:0;background:transparent;border-radius:9px;padding:7px 10px;font:600 13.5px/1.3 var(--sans);color:var(--wink);cursor:pointer}
.grp button span{font-family:var(--mono);font-size:11px;color:var(--wmuted);min-width:20px;font-weight:500}
.grp button:hover{background:var(--hover)}
.grp button.on{background:var(--wink);color:var(--ground)}
.grp button.on span{color:var(--ground);opacity:.75}
.main{display:flex;flex-wrap:wrap;justify-content:center;align-items:flex-start;gap:28px 40px;padding:24px clamp(16px,3vw,40px) 48px}
.stage{display:flex;flex-direction:column;align-items:center;gap:10px}
.where{font-family:var(--mono);font-size:12px;color:var(--wmuted)}
.notes{width:min(360px,100%);display:flex;flex-direction:column;gap:12px;padding-top:30px}
.notes h2{margin:0;font-size:26px;line-height:1.08;letter-spacing:-.035em}
.notes ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:9px}
.notes li{display:grid;grid-template-columns:52px 1fr;gap:10px;font-size:14px;line-height:1.5;align-items:baseline}
.tag{font-family:var(--mono);font-size:10.5px;font-weight:600;letter-spacing:.03em;padding:2px 6px;border-radius:5px;white-space:nowrap;justify-self:start}
.tag.call{color:var(--t-ivan);background:var(--t-ivan-bg)}
.tag.bb{color:var(--t-bb);background:var(--t-bb-bg)}
.tag.ask{color:var(--t-ask);background:var(--t-ask-bg)}
.mnav{display:none}
@media (max-width:820px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .rail{position:static;height:auto;border-right:0;border-bottom:1px solid var(--wline);padding:16px}
  .grp{display:none}
  .mnav{display:block}
  .mnav select{width:100%;font:600 15px var(--sans);padding:10px;border-radius:10px;border:1px solid var(--wline);background:var(--ground);color:var(--wink)}
  .notes{padding-top:0}
}
body.shot{background:#F4F0EC}
body.shot .rail,body.shot .notes,body.shot .where{display:none}
body.shot .shell{display:block}
body.shot .main{padding:0;display:block}
body.shot .stage{display:block}
body.shot .phone{border-radius:0;box-shadow:none}

/* ---------- app world (fixed light, v2 tokens) ---------- */
.phone{
  --coral:#FF4F5E; --coral-d:#D8304A; --cyan:#2DD4D8; --gold:#C9A227; --gold-soft:#F7F1DE;
  --teal:#0B7B7F; --teal-soft:#E4F4F4; --paper:#F4F0EC; --ink:#171312; --mid:#766C67; --hair:#E4DCD5; --pill:#EAE3DD;
  width:390px;height:844px;border-radius:28px;overflow:hidden;background:var(--paper);color:var(--ink);
  font-family:var(--sans);font-size:15px;line-height:1.4;position:relative;flex:none;
  box-shadow:0 0 0 1px rgba(18,32,31,.08),0 40px 70px -40px rgba(18,32,31,.55);
}
.phone.desk{width:1280px;height:800px;border-radius:14px}
.scr{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;display:flex;flex-direction:column;scrollbar-width:none}
.scr::-webkit-scrollbar{display:none}
.phone.hasbar .scr{bottom:74px}
.phone button{font-family:var(--sans);color:inherit}
.pb{padding:4px 16px 24px;display:flex;flex-direction:column;gap:18px}
.tb{display:flex;align-items:center;gap:8px;padding:14px 16px 10px;position:sticky;top:0;background:var(--paper);z-index:4;min-height:62px}
.logo{font-weight:800;letter-spacing:-.04em;font-size:18px;white-space:nowrap;background:none;border:0;padding:0;cursor:pointer;color:var(--ink)}
.logo b{color:var(--cyan);font-weight:800}
.tt{font-weight:800;font-size:17px;letter-spacing:-.02em}
.sp{flex:1}
.ib{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:transparent;border:0;flex:none;cursor:pointer;padding:0;color:var(--ink)}
.ib svg{width:22px;height:22px}
.cp{height:30px;padding:0 11px;border-radius:999px;background:var(--pill);color:#4C433F;font-size:12.5px;font-weight:700;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;flex:none;border:0;cursor:pointer}
.cp .dot{width:7px;height:7px;box-shadow:0 0 0 3px rgba(45,212,216,.25)}
.h1{font-size:28px;font-weight:800;letter-spacing:-.04em;line-height:1.1;margin:0;text-wrap:balance}
.h1 em{font-style:normal;color:var(--coral)}
.h2{font-size:22px;font-weight:800;letter-spacing:-.035em;line-height:1.15;margin:0}
.h2 em{font-style:normal;color:var(--coral)}
.fine{font-size:13px;color:var(--mid);text-align:center;margin:0}
.lbl{font-size:13px;font-weight:600;color:var(--mid);margin:0}
.sample{font-family:var(--mono);font-size:10px;font-weight:600;letter-spacing:.06em;color:#8A6D10;background:var(--gold-soft);border:1px solid #EAD9A4;border-radius:5px;padding:1px 5px;vertical-align:middle}

.b{display:flex;align-items:center;justify-content:center;gap:8px;min-height:52px;border-radius:14px;font:700 16px/1.1 var(--sans);border:0;cursor:pointer;padding:0 18px;text-align:center;width:100%}
.b svg{width:19px;height:19px;flex:none}
.b1{background:var(--coral);color:#fff!important;box-shadow:0 10px 22px -12px rgba(255,79,94,.75)}
.b2{background:#fff;color:var(--ink);border:1.5px solid var(--hair)}
.b3{background:transparent;color:var(--mid);min-height:44px;font-weight:600;font-size:15px}

/* search */
.sf{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--hair);border-radius:18px;padding:6px 6px 6px 16px;box-shadow:0 12px 30px -20px rgba(23,19,18,.45);position:relative}
.sf>svg{width:20px;height:20px;color:var(--mid);flex:none}
.sf .in{flex:1;min-width:0;font:500 16px var(--sans);color:#9A908B;padding:12px 0;white-space:nowrap;overflow:hidden}
.sf .in.typed{color:var(--ink)}
.sf .in .cur{display:inline-block;width:2px;height:19px;background:var(--coral);vertical-align:-4px;margin-left:1px}
.sf .go{width:46px;height:46px;border-radius:13px;background:var(--coral);color:#fff;display:grid;place-items:center;border:0;flex:none;cursor:pointer;padding:0}
.sf .go svg{width:20px;height:20px}
.sf.focus{border-color:var(--ink);box-shadow:0 0 0 3px rgba(23,19,18,.06)}
.sugg{background:#fff;border-radius:18px;border:1px solid var(--hair);overflow:hidden;margin-top:-10px;box-shadow:0 18px 40px -26px rgba(23,19,18,.5)}
.sugg button{display:flex;align-items:center;gap:12px;width:100%;border:0;border-top:1px solid #F0EAE5;background:none;padding:0 16px;min-height:50px;font:600 15.5px var(--sans);cursor:pointer;text-align:left}
.sugg button:first-child{border-top:0}
.sugg button svg{width:17px;height:17px;color:var(--mid);flex:none}
.sugg button b{font-weight:800}
.sugg button .ar{margin-left:auto;transform:rotate(-45deg)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:36px;padding:0 14px;border-radius:999px;background:#fff;border:1px solid var(--hair);font:600 14px var(--sans);display:inline-flex;align-items:center;gap:6px;cursor:pointer;color:var(--ink);white-space:nowrap}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.chip svg{width:15px;height:15px}
.hscroll{display:flex;gap:8px;overflow:hidden;margin-right:-16px}

/* cards + lists */
.card{background:#fff;border-radius:20px;padding:14px 14px 6px;display:flex;flex-direction:column}
.card .hdr{display:flex;justify-content:space-between;align-items:baseline;font-weight:800;font-size:16px;letter-spacing:-.01em;padding-bottom:6px}
.card .hdr button{color:var(--coral-d);background:none;border:0;font:700 14px var(--sans);cursor:pointer;padding:0}
.card .hdr small{font-weight:700;color:var(--mid);font-size:13px}
.hrow{display:grid;grid-template-columns:36px minmax(0,1fr) auto;gap:12px;align-items:center;background:none;border:0;border-top:1px solid #F0EAE5;padding:10px 0;text-align:left;cursor:pointer;width:100%}
.hrow:first-of-type{border-top:0}
.hrow .hi{width:36px;height:36px;border-radius:11px;background:var(--paper);display:grid;place-items:center;color:var(--mid)}
.hrow .hi svg{width:17px;height:17px}
.hrow.ready .hi{background:var(--gold-soft);color:var(--gold)}
.hrow.run .hi{background:var(--teal-soft)}
.hrow .th{width:36px;height:48px;border-radius:9px;background:#d9d2cc center/cover}
.hrow.run .th{opacity:.75}
.hrow .tx{display:flex;flex-direction:column;gap:3px;min-width:0}
.hrow .tx>b{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hrow .tx small{font-size:12.5px;color:var(--mid)}
.hrow .tx small b.s{color:var(--gold);font-weight:800}
.rd{color:var(--teal);font-weight:700}
.hrow svg.chev{width:18px;height:18px;color:var(--mid)}
.prog{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--teal);font-weight:700;white-space:nowrap}
.pbar{flex:1;height:5px;border-radius:9px;background:var(--pill);overflow:hidden;max-width:140px;min-width:40px}
.pbar i{display:block;height:100%;background:var(--cyan);border-radius:9px}
.dot{width:10px;height:10px;border-radius:50%;background:var(--cyan);box-shadow:0 0 0 5px rgba(45,212,216,.25);flex:none;display:inline-block}

/* checklist */
.chk{background:#fff;border-radius:20px;padding:14px 14px 4px}
.chk .hdr{display:flex;justify-content:space-between;align-items:center;font-weight:800;font-size:16px;padding-bottom:8px}
.chk .hdr small{font:600 12px var(--mono);color:var(--mid)}
.chk .meter{height:5px;border-radius:9px;background:var(--pill);overflow:hidden;margin-bottom:6px}
.chk .meter i{display:block;height:100%;background:var(--teal)}
.chk button{display:grid;grid-template-columns:26px 1fr 18px;gap:12px;align-items:center;width:100%;border:0;border-top:1px solid #F0EAE5;background:none;padding:12px 0;font:600 15px var(--sans);text-align:left;cursor:pointer}
.chk button:first-of-type{border-top:0}
.chk .ck{width:24px;height:24px;border-radius:50%;border:1.5px solid var(--hair);display:grid;place-items:center}
.chk .ck svg{width:14px;height:14px}
.chk button.done{color:var(--mid);text-decoration:line-through;text-decoration-color:#CFC4BB}
.chk button.done .ck{background:var(--teal);border-color:var(--teal);color:#fff}
.chk button.next .ck{border-color:var(--coral)}
.chk button svg.chev{width:18px;height:18px;color:var(--mid)}
.chk button.done svg.chev{visibility:hidden}

/* video card */
.vc{background:#fff;border-radius:22px;padding:10px;display:flex;flex-direction:column;gap:12px;box-shadow:0 12px 30px -24px rgba(23,19,18,.5)}
.vt{position:relative;border-radius:14px;overflow:hidden;background:#d9d2cc center/cover no-repeat;display:block;width:100%;aspect-ratio:4/5;border:0;padding:0}
.vt .pl{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:50px;height:50px;border-radius:50%;background:rgba(255,255,255,.93);display:grid;place-items:center;color:var(--ink)}
.vt .pl svg{width:18px;height:18px;margin-left:3px}
.vt .sb{position:absolute;left:10px;bottom:10px;background:#fff;border-radius:12px;padding:5px 11px 6px;display:flex;align-items:baseline;gap:6px;box-shadow:0 8px 20px -10px rgba(0,0,0,.4)}
.vt .sb b{color:var(--gold);font-size:24px;font-weight:800;letter-spacing:-.03em}
.vt .sb span{font-size:11.5px;color:var(--mid);font-weight:600}
.vt .du{position:absolute;right:10px;bottom:12px;background:rgba(23,19,18,.62);color:#fff;border-radius:999px;padding:4px 8px;font-size:11.5px;font-weight:700}
.vt .catc{position:absolute;left:10px;top:10px;background:rgba(255,255,255,.93);border-radius:999px;padding:4px 10px;font-size:12px;font-weight:700}
.vt .anb{position:absolute;right:10px;top:10px;background:var(--teal);color:#fff;border-radius:999px;padding:4px 10px 4px 8px;font-size:12px;font-weight:700;display:flex;align-items:center;gap:4px}
.vt .anb svg{width:13px;height:13px}
.vc .meta{padding:0 6px;display:flex;flex-direction:column;gap:6px}
.hd{font-weight:700;font-size:15.5px}
.hd small{color:var(--mid);font-weight:500;font-size:13px}
.st{display:flex;flex-wrap:wrap;gap:6px 14px;color:var(--mid);font-size:13px;font-weight:600}
.st span{display:inline-flex;gap:5px;align-items:center}
.st svg{width:15px;height:15px}
.acts{display:grid;grid-template-columns:1fr 52px 52px;gap:10px}
.sq{width:52px;height:52px;border-radius:14px;background:#fff;border:1.5px solid var(--hair);display:grid;place-items:center;cursor:pointer;padding:0}
.sq svg{width:19px;height:19px}
.sq.on{border-color:var(--teal);color:var(--teal);background:var(--teal-soft)}
.bout{background:#fff;color:var(--coral-d);border:1.5px solid #F5B7BF}
.brun{background:var(--teal-soft);color:var(--teal);border:1.5px solid #BDE4E5;cursor:default;position:relative;overflow:hidden;font-size:15px}
.brun i{position:absolute;left:0;top:0;bottom:0;background:rgba(45,212,216,.22)}
.brun span{position:relative;display:flex;align-items:center;gap:8px}

/* results numbers (quiet, no boxes) */
.q3{display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:8px;padding:2px 2px 0}
.q3 b{display:block;font-size:24px;font-weight:800;letter-spacing:-.035em;line-height:1.1;font-variant-numeric:tabular-nums}
.q3 b.g{color:var(--gold)}
.q3 small{display:block;font-size:12px;color:var(--mid);font-weight:600}
.upd{display:flex;flex-direction:column;gap:7px;background:var(--teal-soft);border:1px solid #BDE4E5;border-radius:14px;padding:10px 12px}
.upd .r{display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:700;color:var(--teal)}
.upd .r .u{margin-left:auto;font-weight:600;color:var(--mid);font-size:12.5px}
.upd .bar{height:4px;border-radius:9px;background:#CDEBEB;overflow:hidden}
.upd .bar i{display:block;height:100%;width:38%;background:var(--cyan);border-radius:9px}
.stale{opacity:.55}

/* top feed */
.feedhd{display:flex;flex-direction:column;gap:12px}

/* first search wait */
.wait{display:flex;flex-direction:column;gap:10px;background:#fff;border-radius:20px;padding:16px}
.wait .r{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.wait .r b{font-size:17px;font-weight:800;letter-spacing:-.02em}
.wait .r b em{font-style:normal;color:var(--coral)}
.wait .r span{font:600 13px var(--mono);color:var(--mid)}
.wait .bar{height:6px;border-radius:9px;background:var(--pill);overflow:hidden}
.wait .bar i{display:block;height:100%;background:var(--cyan);border-radius:9px}
.wait small{font-size:12.5px;color:var(--mid)}
.rdy{display:grid;grid-template-columns:52px 1fr;gap:12px;align-items:center;background:#FBF5E3;border:1px solid #EBDDAA;border-radius:20px;padding:14px}
.rdy .tile{width:52px;height:52px;border-radius:16px;background:linear-gradient(#fff,var(--gold-soft));border:1px solid #EAD9A4;display:grid;place-items:center;color:var(--gold)}
.rdy .tile svg{width:24px;height:24px}
.rdy b{font-size:17px;font-weight:800;letter-spacing:-.02em;display:block}
.rdy small{font-size:13px;color:var(--mid);font-weight:600}
.rdy .b{grid-column:1/-1}
.howto{position:relative;aspect-ratio:9/12;border-radius:20px;overflow:hidden;background:linear-gradient(160deg,#171312 0%,#0B4F52 100%);color:#fff;display:block;width:100%;border:0;padding:0;cursor:pointer;text-align:left}
.phone .howto{color:#fff}
.howto .hw-h{position:absolute;left:18px;right:18px;top:18px;font-weight:800;font-size:22px;line-height:1.2;letter-spacing:-.02em}
.howto .hw-p{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:64px;height:64px;border-radius:50%;background:var(--coral);display:grid;place-items:center}
.howto .hw-p svg{width:22px;height:22px;margin-left:4px}
.howto .hw-d{position:absolute;left:18px;bottom:20px;font:600 12px var(--mono);background:rgba(255,255,255,.16);padding:3px 8px;border-radius:6px}
.howto .hw-bar{position:absolute;left:0;right:0;bottom:0;height:4px;background:rgba(255,255,255,.18)}
.howto .hw-bar i{display:block;height:100%;background:var(--cyan)}
.howto .hw-k{position:absolute;right:18px;bottom:20px;font:600 12px var(--mono);color:rgba(255,255,255,.8)}
.howto.playing .hw-p{background:rgba(255,255,255,.18)}
.howto .ph{position:absolute;inset:auto 18px 54px 18px;display:flex;flex-direction:column;gap:8px}
.howto .ph i{display:block;height:9px;border-radius:5px;background:rgba(255,255,255,.14)}

/* bottom bar */
.bar4{position:absolute;left:0;right:0;bottom:0;height:74px;z-index:10;display:grid;grid-template-columns:repeat(4,1fr);background:#fff;border-top:1px solid var(--hair);padding:6px 6px 14px}
.bar4 button{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border:0;background:none;font:700 11px var(--sans);color:var(--mid);cursor:pointer;padding:0}
.bar4 svg{width:23px;height:23px}
.bar4 button[aria-current="page"]{color:var(--ink)}
.bar4 button[aria-current="page"]::before{content:"";position:absolute;top:-6px;left:30%;right:30%;height:3px;border-radius:0 0 3px 3px;background:var(--coral)}
.bar4 .bd{position:absolute;top:2px;left:calc(50% + 7px);min-width:17px;height:17px;border-radius:9px;padding:0 4px;font:800 10.5px/17px var(--sans);text-align:center;color:#fff;background:var(--teal);box-shadow:0 0 0 2px #fff}
.bar4 .bd.g{background:var(--gold)}

/* tray: the running search that follows you */

/* ---------- render ---------- */
var ORDER=Object.keys(S).filter(function(k){return !S[k].hideRail;});
function cur(){var h=location.hash.replace("#","");if(S[h]&&S[h].alias)h=S[h].alias;return S[h]?h:"home-new";}
function render(){
  var k=cur(),st=S[k],app=document.getElementById("app");
  var html='<div class="phone'+(st.desk?' desk':'')+(st.bar?' hasbar':'')+(st.overlay?' hasov':'')+'"><div class="scr">'+st.body()+'</div>'+(st.bar?bar(st.bar==="lib"?"library":st.bar,st.badge):'')+(st.overlay?st.overlay():'')+'</div>';
  app.innerHTML=html;
  document.getElementById("where").textContent="#"+k;
  var groups={},gorder=[];
  ORDER.forEach(function(x){var g=S[x].g;if(!groups[g]){groups[g]=[];gorder.push(g);}groups[g].push(x);});
  document.getElementById("groups").innerHTML=gorder.map(function(g){return '<div class="grp"><h2>'+g+'</h2>'+groups[g].map(function(x){return '<button data-nav="'+x+'" class="'+(x===k?'on':'')+'"><span>'+S[x].n+'</span>'+S[x].l+'</button>';}).join("")+'</div>';}).join("");
  document.getElementById("msel").innerHTML=ORDER.map(function(x){return '<option value="'+x+'"'+(x===k?' selected':'')+'>'+S[x].n+'  '+S[x].l+'</option>';}).join("");
  var tagName={call:"CALL",bb:"BB 3.0",ask:"ASK"};
  document.getElementById("notes").innerHTML='<h2>'+(st.l||"")+'</h2><ul>'+(st.notes||[]).map(function(n){return '<li><span class="tag '+n[0]+'">'+tagName[n[0]]+'</span><span>'+n[1]+'</span></li>';}).join("")+'</ul>';
}
document.addEventListener("click",function(e){
  var n=e.target.closest("[data-nav]");if(n){location.hash=n.getAttribute("data-nav");return;}
  var g=e.target.closest("[data-go]");if(g){e.stopPropagation();location.hash=g.getAttribute("data-go");}
},true);
document.getElementById("msel").addEventListener("change",function(e){location.hash=e.target.value;});
window.addEventListener("hashchange",render);
render();
})();
</script>
