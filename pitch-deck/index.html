<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Pitch Deck Generator</title>
<meta name="description" content="UGC Breakouts proposal: a creator builds a brand pitch deck from TikTok breakouts.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
:root{
  --ground:#DCE4E3; --surface:#EEF3F2; --wink:#12201F; --wmuted:#4F5E5C; --wline:#C2CECC; --hover:#E3EBEA;
  --acc:#0B6F73; --t-slack:#0B6F73; --t-slack-bg:#CFE6E5; --t-new:#7A4E00; --t-new-bg:#F1E3C4;
  --t-ask:#A8243A; --t-ask-bg:#F5D9DD; --t-ivan:#5B3FB0; --t-ivan-bg:#E4DDF6;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --sans:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#0F1616; --surface:#172121; --wink:#E3ECEB; --wmuted:#98A8A6; --wline:#2B3A39; --hover:#1F2B2B;
    --acc:#5ED6D9; --t-slack:#7FE0E2; --t-slack-bg:#163536; --t-new:#E8BE62; --t-new-bg:#3A2E14;
    --t-ask:#FF97A2; --t-ask-bg:#40202A; --t-ivan:#C3B1FF; --t-ivan-bg:#2B2447;
  }
}
:root[data-theme="dark"]{
  --ground:#0F1616; --surface:#172121; --wink:#E3ECEB; --wmuted:#98A8A6; --wline:#2B3A39; --hover:#1F2B2B;
  --acc:#5ED6D9; --t-slack:#7FE0E2; --t-slack-bg:#163536; --t-new:#E8BE62; --t-new-bg:#3A2E14;
  --t-ask:#FF97A2; --t-ask-bg:#40202A; --t-ivan:#C3B1FF; --t-ivan-bg:#2B2447;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{background:var(--ground);color:var(--wink);font-family:var(--sans);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;margin:0}
.i{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* ---------- shell ---------- */
.shell{display:grid;grid-template-columns:268px minmax(0,1fr);min-height:100vh}
.rail{background:var(--surface);border-right:1px solid var(--wline);height:100vh;position:sticky;top:0;overflow-y:auto;padding:24px 14px 28px;display:flex;flex-direction:column;gap:18px}
.brand{padding:0 8px}
.kicker{font-family:var(--mono);font-size:11.5px;color:var(--acc);margin:0 0 6px}
.brand h1{margin:0;font-size:26px;line-height:1;letter-spacing:-.045em;font-weight:800}
.brand h1 b{color:var(--acc)}
.brand p{margin:8px 0 0;font-size:12.5px;color:var(--wmuted);line-height:1.45}
#rail-groups{display:flex;flex-direction:column;gap:18px}
.grp{display:flex;flex-direction:column;gap:2px}
.grp h2{font-family:var(--mono);font-size:10.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--wmuted);margin:0 0 4px;padding:0 10px}
.grp button{display:flex;gap:10px;align-items:baseline;text-align:left;border:1px solid transparent;background:transparent;border-radius:9px;padding:7px 10px;font:600 13.5px/1.3 var(--sans);color:var(--wink);cursor:pointer}
.grp button span{font-family:var(--mono);font-size:11px;color:var(--wmuted);min-width:26px;font-weight:500}
.grp button:hover{background:var(--hover)}
.grp button.on{background:var(--wink);color:var(--ground)}
.grp button.on span{color:var(--ground);opacity:.75}
.grp button:focus-visible,.mnav select:focus-visible,.stagebar button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}

.main{display:flex;flex-wrap:wrap;justify-content:center;align-items:flex-start;gap:32px 40px;padding:20px clamp(16px,3vw,40px) 48px}
.stage{position:sticky;top:20px;display:flex;flex-direction:column;align-items:center;gap:12px;width:min(390px,100%)}
.stagebar{display:flex;gap:8px;align-items:center;justify-content:space-between;width:100%;min-height:32px}
.stagebar .where{font-family:var(--mono);font-size:12px;color:var(--wmuted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stagebar .ctl{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.stagebar button{font:600 12px var(--sans);color:var(--wink);background:var(--surface);border:1px solid var(--wline);border-radius:7px;padding:5px 9px;cursor:pointer;white-space:nowrap}
.stagebar button:hover{border-color:var(--acc)}

.notes{width:min(400px,100%);display:flex;flex-direction:column;gap:14px;padding-top:44px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--wmuted);padding-bottom:14px;border-bottom:1px solid var(--wline)}
.tag{font-family:var(--mono);font-size:10.5px;font-weight:600;letter-spacing:.03em;padding:2px 6px;border-radius:5px;white-space:nowrap}
.tag.s{color:var(--t-slack);background:var(--t-slack-bg)}
.tag.n{color:var(--t-new);background:var(--t-new-bg)}
.tag.a{color:var(--t-ask);background:var(--t-ask-bg)}
.tag.r{color:var(--t-ivan);background:var(--t-ivan-bg)}
.tag.c{color:var(--t-new);background:var(--t-new-bg)}
.tag.q{color:var(--t-slack);background:var(--t-slack-bg)}
.tag.v{color:var(--wink);background:var(--wline)}
.tag.f{color:var(--t-ask);background:transparent;box-shadow:inset 0 0 0 1px var(--t-ask)}
.tag.d{color:var(--wmuted);background:transparent;box-shadow:inset 0 0 0 1px var(--wline)}
.sid{font-family:var(--mono);font-size:12.5px;color:var(--acc);margin:0}
.notes h2{margin:0;font-size:28px;line-height:1.05;letter-spacing:-.035em;text-wrap:balance}
.notes .why{margin:0;color:var(--wmuted);font-size:14.5px}
.try{margin:0;font-size:13.5px;background:var(--surface);border:1px solid var(--wline);border-radius:10px;padding:10px 12px}
.try b{font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;color:var(--acc);margin-right:6px}
.notes ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:9px}
.notes li{display:grid;grid-template-columns:58px 1fr;gap:10px;font-size:14px;line-height:1.5;align-items:baseline}
.notes li .tag{justify-self:start}
.notes ol{margin:0;padding-left:1.3em;display:flex;flex-direction:column;gap:10px;font-size:14px}
.notes ol li{display:list-item}
.notes ol li::marker{font-family:var(--mono);color:var(--acc);font-size:12px}

.mnav{display:none}
@media (max-width:820px){
  .shell{grid-template-columns:1fr}
  .rail{position:static;height:auto;border-right:0;border-bottom:1px solid var(--wline);padding:16px}
  .grp{display:none}
  .mnav{display:block}
  .mnav label{font-size:12px;color:var(--wmuted);display:block;margin-bottom:4px}
  .mnav select{width:100%;font:600 15px var(--sans);padding:10px;border-radius:10px;border:1px solid var(--wline);background:var(--ground);color:var(--wink)}
  .stage{position:static}
  .notes{padding-top:0}
}

/* ---------- app (fixed light world, per product locks) ---------- */
.phone{
  --coral:#FF4F5E; --coral-d:#D8304A; --cyan:#2DD4D8; --gold:#C9A227; --gold-soft:#F7F1DE;
  --teal:#0B7B7F; --teal-soft:#E4F4F4; --paper:#F4F0EC; --ink:#171312; --mid:#766C67; --hair:#E4DCD5; --pill:#EAE3DD;
  width:100%;height:min(844px,calc(100dvh - 72px));min-height:620px;border-radius:26px;overflow:hidden;background:var(--paper);color:var(--ink);
  font-family:var(--sans);font-size:15px;line-height:1.4;position:relative;
  box-shadow:0 0 0 1px rgba(18,32,31,.08),0 40px 70px -40px rgba(18,32,31,.55);
}
@media (max-width:820px){.phone{height:760px}}
.scr{height:100%;overflow-y:auto;display:flex;flex-direction:column;overscroll-behavior:contain;scrollbar-width:thin;position:relative}
.phone a{color:inherit}
.phone button{font-family:var(--sans)}
.phone a:focus-visible,.phone button:focus-visible,.phone input:focus-visible,.phone textarea:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
.pb{padding:4px 16px 24px;display:flex;flex-direction:column;gap:18px;flex:1}
.tb{display:flex;align-items:center;gap:8px;padding:14px 16px 10px;position:sticky;top:0;background:var(--paper);z-index:4}
.logo{font-weight:800;letter-spacing:-.04em;font-size:18px;white-space:nowrap;text-decoration:none;background:none;border:0;padding:0;cursor:pointer;color:var(--ink)}
.logo b{color:var(--cyan);font-weight:800}
.tt{font-weight:800;font-size:17px;letter-spacing:-.02em}
.sp{flex:1}
.ib{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;color:var(--ink);background:transparent;border:0;flex:none;cursor:pointer;padding:0}
.ib svg{width:22px;height:22px}
.ib.ghost{visibility:hidden}
.qp{flex:1;min-width:0;height:38px;border-radius:999px;background:#fff;border:1px solid var(--hair);display:flex;align-items:center;gap:8px;padding:0 14px;font-weight:600;font-size:14px;cursor:pointer;color:var(--ink)}
.qp svg{width:16px;height:16px;color:var(--mid);flex:none}
.qp span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cp{height:30px;padding:0 11px;border-radius:999px;background:var(--pill);color:#4C433F;font-size:12.5px;font-weight:700;display:inline-flex;align-items:center;gap:5px;white-space:nowrap;flex:none;border:0;cursor:pointer}
.cp.zero{background:#FCE3E7;color:var(--coral-d)}
.cp.pro{background:var(--gold-soft);color:#8A6D10}

.b{display:flex;align-items:center;justify-content:center;gap:8px;min-height:52px;border-radius:14px;font:700 16px/1.1 var(--sans);text-decoration:none;border:0;cursor:pointer;padding:0 18px;text-align:center}
.b svg{width:19px;height:19px;flex:none}
.b1{background:var(--coral);color:#fff;box-shadow:0 10px 22px -12px rgba(255,79,94,.75)}
.b1:active{transform:translateY(1px)}
.b2{background:#fff;color:var(--ink);border:1.5px solid var(--hair)}
.b2.on{border-color:var(--teal);color:var(--teal);background:var(--teal-soft)}
.b3{background:transparent;color:var(--mid);min-height:44px;font-weight:600;font-size:15px}
.btt{background:#010101;color:#fff}
.bi{width:52px;padding:0;flex:none}
.full-w{width:100%}
.row{display:flex;gap:10px}
.row>.grow{flex:1}
.busy{opacity:.75;pointer-events:none}

.sf{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--hair);border-radius:18px;padding:6px 6px 6px 16px;box-shadow:0 12px 30px -20px rgba(23,19,18,.45)}
.sf>svg{width:20px;height:20px;color:var(--mid);flex:none}
.sf input{flex:1;min-width:0;border:0;background:transparent;font:500 16px var(--sans);color:var(--ink);outline:none;padding:12px 0}
.sf input::placeholder{color:#9A908B}
.sf .go{width:46px;height:46px;border-radius:13px;background:var(--coral);color:#fff;display:grid;place-items:center;border:0;flex:none;cursor:pointer;padding:0}
.sf .go svg{width:20px;height:20px}
.sr{position:absolute;left:-9999px}
.lbl{font-size:13px;font-weight:600;color:var(--mid);margin:0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:36px;padding:0 14px;border-radius:999px;background:#fff;border:1px solid var(--hair);font:600 14px var(--sans);display:inline-flex;align-items:center;gap:6px;cursor:pointer;color:var(--ink)}
.chip.ghost{background:transparent}
.chip:hover{border-color:#CFC4BB}
.stack{display:flex;flex-direction:column;gap:10px}

.vt{position:relative;border-radius:14px;overflow:hidden;background:#d9d2cc center/cover no-repeat;flex:none;border:0;padding:0;display:block;cursor:pointer;width:100%}
.vt .pl{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:50px;height:50px;border-radius:50%;background:rgba(255,255,255,.93);display:grid;place-items:center;color:var(--ink)}
.vt .pl svg{width:18px;height:18px;margin-left:3px}
.vt.sm .pl{width:34px;height:34px}.vt.sm .pl svg{width:13px;height:13px;margin-left:2px}
.vt.playing::after{content:"";position:absolute;left:0;bottom:0;height:4px;background:var(--cyan);animation:play 18s linear forwards}
.vt.playing .pl{opacity:0}
@keyframes play{from{width:0}to{width:100%}}
.br{position:absolute;left:10px;top:10px;background:rgba(255,255,255,.93);border-radius:999px;padding:5px 10px;font-size:12px;font-weight:700;white-space:nowrap;color:var(--ink)}
.br i{font-style:normal;color:var(--mid);font-weight:600}
.du{position:absolute;right:10px;top:10px;background:rgba(23,19,18,.62);color:#fff;border-radius:999px;padding:4px 8px;font-size:11.5px;font-weight:700;font-variant-numeric:tabular-nums}
.sb{position:absolute;left:10px;bottom:10px;background:#fff;border-radius:12px;padding:5px 11px 6px;display:flex;align-items:baseline;gap:6px;box-shadow:0 8px 20px -10px rgba(0,0,0,.4)}
.sb b{color:var(--gold);font-size:24px;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.sb span{font-size:11.5px;color:var(--mid);font-weight:600}
.vt .ex{position:absolute;left:6px;bottom:6px;background:rgba(23,19,18,.62);color:#fff;border-radius:6px;padding:2px 6px;font-size:10.5px;font-weight:700}

.st{display:flex;flex-wrap:wrap;gap:6px 14px;color:var(--mid);font-size:13px;font-weight:600;font-variant-numeric:tabular-nums}
.st span{display:inline-flex;gap:5px;align-items:center}
.st svg{width:15px;height:15px}
.cd{background:#fff;border-radius:22px;padding:10px;display:flex;flex-direction:column;gap:12px;box-shadow:0 12px 30px -24px rgba(23,19,18,.5);border:1px solid rgba(23,19,18,.05)}
.cd .meta{padding:0 6px;display:flex;flex-direction:column;gap:6px}
.hd{font-weight:700;font-size:15.5px}
.hd small{color:var(--mid);font-weight:500;font-size:13px}
.useone{font-size:12px;color:var(--mid);text-align:center;margin:-4px 0 2px}

.box{border-radius:20px;padding:18px 16px;display:flex;flex-direction:column;gap:12px}
.box h3{margin:0;font-size:18px;letter-spacing:-.025em;line-height:1.2}
.box.teal{background:var(--teal-soft)}
.box.white{background:#fff;border:1px solid rgba(23,19,18,.05)}
.eb{font-size:11.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--teal);margin:0}
.eb.c{color:var(--coral-d)} .eb.m{color:var(--mid)}
.phone .q{background:#fff;border-radius:14px;padding:12px 14px;font-weight:700;font-size:16px;line-height:1.35;margin:0}
.ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:11px;counter-reset:n}
.ol li{display:grid;grid-template-columns:26px 1fr;gap:10px;font-size:14.5px;line-height:1.45;counter-increment:n}
.ol li::before{content:counter(n);width:26px;height:26px;border-radius:8px;background:#FCE6EA;color:var(--coral-d);font-weight:800;font-size:13px;display:grid;place-items:center}
.teal .ol li::before{background:#C9E9E9;color:var(--teal)}
.hk{display:flex;flex-direction:column;gap:6px}
.hk button{align-self:flex-start;border:0;background:transparent;color:var(--teal);font:700 12.5px var(--sans);padding:0;cursor:pointer;display:inline-flex;gap:5px;align-items:center}
.hk button svg{width:14px;height:14px}
.chk{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
.chk li{display:grid;grid-template-columns:24px 1fr;gap:10px;font-size:15px;line-height:1.4}
.chk li svg{width:22px;height:22px;color:var(--teal);margin-top:-1px}
.chk li small{display:block;color:var(--mid);font-size:13.5px;margin-top:2px}
.shots{display:flex;flex-direction:column}
.shot{display:grid;grid-template-columns:84px 1fr;gap:10px;padding:11px 0;border-top:1px solid var(--hair);font-size:14.5px;line-height:1.45}
.shot:first-child{border-top:0;padding-top:0}
.tc{font-family:var(--mono);font-size:11.5px;color:var(--coral-d);font-weight:600;padding-top:3px;font-variant-numeric:tabular-nums}
.shotnote{font-size:13.5px;color:var(--mid);background:var(--paper);border-radius:12px;padding:10px 12px;margin:0}

.dock{position:sticky;bottom:0;margin-top:auto;padding:14px 16px 18px;background:linear-gradient(rgba(244,240,236,0),var(--paper) 26%);display:flex;flex-direction:column;gap:10px;z-index:4}
.dock.bar{background:#fff;border-top:1px solid var(--hair);padding-top:12px}

/* overlays */
.toast{position:absolute;left:16px;right:16px;bottom:24px;background:var(--ink);color:#fff;border-radius:14px;padding:12px 14px;font-size:13.5px;display:flex;gap:10px;align-items:flex-start;z-index:30;box-shadow:0 18px 40px -18px rgba(0,0,0,.6)}
.toast svg{width:18px;height:18px;color:var(--cyan);flex:none;margin-top:1px}
.toast button{margin-left:auto;background:none;border:0;color:var(--cyan);font:700 13.5px var(--sans);cursor:pointer;padding:0 0 0 8px;white-space:nowrap}
@media (prefers-reduced-motion: no-preference){.toast{animation:up .22s ease-out}@keyframes up{from{transform:translateY(12px);opacity:0}}}
.scrim{position:absolute;inset:0;background:rgba(23,19,18,.38);z-index:20;border:0;padding:0;cursor:pointer;width:100%}
.sheet{position:absolute;left:0;right:0;bottom:0;background:var(--paper);border-radius:24px 24px 0 0;padding:10px 16px 22px;z-index:21;display:flex;flex-direction:column;gap:6px}
@media (prefers-reduced-motion: no-preference){.sheet{animation:sheet .22s ease-out}@keyframes sheet{from{transform:translateY(40%);opacity:.4}}}
.sheet .grab{width:40px;height:5px;border-radius:9px;background:#D6CDC6;align-self:center;margin-bottom:8px}
.sheet .mi{display:flex;justify-content:space-between;align-items:center;min-height:52px;padding:0 14px;background:#fff;border:0;border-radius:14px;font:600 16px var(--sans);cursor:pointer;color:var(--ink);text-align:left}
.sheet .mi small{color:var(--mid);font-weight:600;font-size:13px}
.sheet .mi.up{background:var(--coral);color:#fff}
.sheet .mi.up small{color:#FFE3E6}

/* home out */
.mos{position:absolute;inset:0 0 auto 0;height:330px;display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:6px;opacity:.7}
.mos div{border-radius:12px;background:center/cover no-repeat}
.mos::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(244,240,236,.15) 0%,rgba(244,240,236,.75) 55%,var(--paper) 100%)}
.hero{position:relative;z-index:1;padding:190px 16px 24px;display:flex;flex-direction:column;gap:18px}
.wm{font-size:30px;font-weight:800;letter-spacing:-.05em;display:flex;align-items:center;gap:8px;margin:0}
.wm::before{content:"";width:14px;height:14px;border-radius:50%;background:var(--cyan);box-shadow:0 0 0 5px rgba(45,212,216,.25)}
.wm b{color:var(--cyan)}
.tag1{font-size:25px;font-weight:800;letter-spacing:-.035em;line-height:1.18;margin:0}
.tag1 span{display:block}
.aud{margin:-8px 0 0;color:var(--mid);font-weight:600;font-size:14px}

/* teaser */
.h1{font-size:28px;font-weight:800;letter-spacing:-.04em;line-height:1.1;margin:0;text-wrap:balance}
.h1 em{font-style:normal;color:var(--coral)}
.sub{margin:0;color:var(--mid);font-size:16px;line-height:1.45}
.fine{font-size:12.5px;color:var(--mid);text-align:center;margin:0}
.lnk{background:none;border:0;padding:0;font:inherit;color:inherit;text-decoration:underline;cursor:pointer}
.sample{background:#fff;border-radius:22px;overflow:hidden;border:1px solid rgba(23,19,18,.06);position:relative}
.sample .band{background:linear-gradient(90deg,#DDF5F5,#FBEFF1);padding:9px 14px;display:flex;justify-content:space-between;align-items:center;font-size:12px;font-weight:700;color:var(--teal)}
.sample .band span{color:var(--mid);font-weight:600}
.sample .in{padding:14px;display:flex;flex-direction:column;gap:12px}
.mini{display:grid;grid-template-columns:92px 1fr;gap:12px;align-items:center}
.bigs{display:flex;align-items:baseline;gap:8px}
.bigs b{font-size:40px;color:var(--gold);font-weight:800;letter-spacing:-.04em;line-height:1;font-variant-numeric:tabular-nums}
.bigs span{color:var(--mid);font-weight:600;font-size:13.5px}
.locked{position:relative}
.locked .blur{filter:blur(5px);opacity:.6;user-select:none;pointer-events:none}
.locked .lk{position:absolute;inset:0;display:grid;place-items:center}

.chiprow{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:start}
.refresh{background:#fff;border:1px solid var(--hair);border-radius:50%;width:38px;height:38px}

.vit{background:#fff;border-radius:18px;padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.vg{display:grid;grid-template-columns:1fr 1fr;gap:8px;border-top:1px solid var(--hair);padding-top:10px}

.steps2 button small{display:block;margin-top:2px}
/* ---------- desktop frame ---------- */

#frame{position:relative;width:100%}

.dcard{display:grid;grid-template-columns:180px 1fr;gap:18px;background:#fff;border-radius:22px;padding:10px;border:1px solid rgba(23,19,18,.05);box-shadow:0 12px 30px -24px rgba(23,19,18,.5)}

.phone.desk .mos{height:470px;grid-template-columns:repeat(6,1fr);opacity:.6}

.phone.desk .drow{display:flex;flex-direction:column}

.dfill{flex:1}

/* ---------- sales page, below the logged out fold ---------- */
.sell{position:relative;z-index:1;display:flex;flex-direction:column;background:var(--paper)}

.s1{font-size:27px;font-weight:800;letter-spacing:-.04em;line-height:1.14;margin:0;text-wrap:balance}

.pain{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:16px}

.st3 b{font-size:17px;letter-spacing:-.025em;line-height:1.25}
.st3 span{color:var(--mid);font-size:14.5px;line-height:1.5}

.gets{display:grid;grid-template-columns:1fr;gap:20px}
.get{display:grid;grid-template-columns:42px 1fr;gap:14px;align-items:start}
.get i{width:42px;height:42px;border-radius:14px;background:var(--teal-soft);color:var(--teal);display:grid;place-items:center}

.jobs{display:grid;grid-template-columns:1fr;gap:12px}

.prices{display:grid;grid-template-columns:1fr;gap:14px}
.pcard{background:var(--paper);border-radius:22px;padding:20px;display:flex;flex-direction:column;gap:16px}
.pcard.pro{background:var(--ink);color:#fff;box-shadow:0 26px 50px -30px rgba(23,19,18,.95)}
.pcard .ph{display:flex;align-items:baseline;gap:10px}
.pcard .ph b{font-size:14px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--mid)}

.pcard .pp{font-size:34px;font-weight:800;letter-spacing:-.045em;line-height:1;margin-left:auto}

.plist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}

.ctabox.plain{background:transparent;padding:0;border-radius:0}
.ordiv{display:flex;align-items:center;gap:12px;color:#8E837D;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;max-width:560px;margin:2px 0}
.ordiv::before,.ordiv::after{content:"";height:1px;background:#3A322E;flex:1}
.sell .ctabox .gbtn{background:transparent;color:#fff;border:1.5px solid #4A413D}
.sfoot{font-size:12.5px;color:#A79C96;text-align:center;margin:0}

/* sales page: interactive bits */
.picklbl{font-size:12.5px;color:#A79C96;margin:0;font-weight:600}
.dchips{display:grid;grid-template-columns:repeat(auto-fit,minmax(132px,1fr));gap:8px}
.dchip{background:transparent;color:#fff;border:1.5px solid #3A322E;border-radius:999px;padding:9px 10px;font:700 13.5px var(--sans);cursor:pointer;text-align:center;min-height:38px}

.hookalt{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:-2px}

.hpill{background:var(--paper);border:1.5px solid transparent;border-radius:999px;padding:6px 8px;font:700 12.5px/1.25 var(--sans);color:var(--mid);cursor:pointer;display:grid;place-items:center;text-align:center;min-height:36px}
.hpill[aria-pressed="true"]{background:var(--teal-soft);color:var(--teal);border-color:#B8E3E3}
.scorerow2{display:flex;align-items:baseline;gap:8px;position:relative}
.scorerow2 .infob{align-self:center}
.sell .sample .pop{position:static;margin-top:2px}
.stripwrap{position:relative}
.strip{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;padding-bottom:4px;-webkit-overflow-scrolling:touch}
.strip::-webkit-scrollbar{display:none}
.strip .tt2{flex:0 0 132px;scroll-snap-align:start}
.strip .th2{aspect-ratio:9/13;border-radius:14px}
.strip .sb{left:6px;bottom:6px;padding:2px 7px 3px}
.strip .sb b{font-size:15px}
.strip .tmeta b{font-size:12.5px}
.arrow{display:none}
.phone.desk .strip{gap:16px}
.phone.desk .strip .tt2{flex:0 0 184px}
.phone.desk .strip .th2{aspect-ratio:9/14;border-radius:16px}
.phone.desk .strip .sb{left:8px;bottom:8px;padding:3px 9px 4px}
.phone.desk .strip .sb b{font-size:19px}
.phone.desk .strip .tmeta b{font-size:14.5px}
.phone.desk .arrow{display:grid;place-items:center;position:absolute;top:36%;width:44px;height:44px;border-radius:50%;background:#fff;border:0;box-shadow:0 12px 26px -12px rgba(23,19,18,.55);cursor:pointer;color:var(--ink);z-index:3;padding:0}
.phone.desk .arrow svg{width:20px;height:20px}
.phone.desk .arrow.l{left:-18px}
.phone.desk .arrow.r{right:-18px}
.rv{opacity:0;transform:translateY(14px)}
.rv.in{opacity:1;transform:none}
@media (prefers-reduced-motion: no-preference){.rv{transition:opacity .5s ease,transform .5s cubic-bezier(.2,.7,.3,1)}}
@media (prefers-reduced-motion: reduce){.rv{opacity:1;transform:none}}
@media (hover:hover){
  .st3,.jobs>div{transition:transform .2s ease,box-shadow .2s ease}
  .st3:hover{transform:translateY(-3px);box-shadow:0 18px 34px -24px rgba(23,19,18,.55)}
  .jobs>div:hover{transform:translateY(-3px);box-shadow:0 22px 42px -26px rgba(23,19,18,.6)}
  .strip .th2{transition:transform .25s ease}
  .strip .tt2:hover .th2{transform:scale(1.04)}
  .dchip:hover{border-color:#6C615B}
  .hpill:hover{color:var(--ink)}
  .arrow:hover{background:var(--paper)}
}

.inp label{font-weight:700;font-size:14px}
.inp label small{font-weight:600;color:var(--mid);font-size:12.5px;margin-left:4px}
.inp input,.inp textarea{width:100%;border:1.5px solid var(--hair);border-radius:14px;min-height:50px;padding:12px 14px;font:500 15px/1.4 var(--sans);background:#fff;color:var(--ink)}
.inp textarea{min-height:76px;resize:vertical}
.inp input:focus,.inp textarea:focus{border-color:var(--teal);outline:none}
.money{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.money .inp input{padding-left:28px}
.money .inp div{position:relative}
.money .inp div::before{content:"$";position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--mid);font-weight:600}
.pickg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.pk3{position:relative;border:0;padding:0;background:none;cursor:pointer;display:flex;flex-direction:column;gap:6px;text-align:left;color:var(--ink);font-family:var(--sans)}
.pk3 .th2{aspect-ratio:9/13;border-radius:14px;outline:3px solid transparent;outline-offset:-3px;transition:outline-color .12s}
.pk3[aria-pressed="true"] .th2{outline-color:var(--coral)}
.pk3 .ck{position:absolute;right:7px;top:7px;width:26px;height:26px;border-radius:50%;background:rgba(255,255,255,.9);display:grid;place-items:center;color:transparent;box-shadow:0 2px 6px rgba(0,0,0,.2)}
.pk3[aria-pressed="true"] .ck{background:var(--coral);color:#fff}
.pk3 .ck svg{width:15px;height:15px}
.pk3 .tmeta b{font-size:11.5px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pk3 .th2{width:100%}
.pk3 .th2 .sb b{font-size:15px}
.pk3 .th2 .sb{left:6px;bottom:6px;padding:2px 7px 3px}
.pbn{display:flex;gap:12px;align-items:center;background:var(--teal-soft);border:1px solid #BDE4E5;border-radius:16px;padding:12px 14px;width:100%;text-align:left;cursor:pointer;font-family:var(--sans);color:var(--ink)}
.pbn .pi{width:38px;height:38px;border-radius:12px;background:#fff;color:var(--teal);display:grid;place-items:center;flex:none}
.pbn .pi svg{width:20px;height:20px}
.pbn .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.pbn .tx b{font-size:15px}
.pbn .tx small{font-size:12.5px;color:var(--mid)}
.pbn .go2{font-weight:700;color:var(--coral-d);font-size:14.5px}
.minihead{display:grid;grid-template-columns:64px 1fr;gap:12px;align-items:center;background:#fff;border-radius:18px;padding:8px}
.minihead .th{width:64px;height:90px;border-radius:12px;background:center/cover}
.faded{opacity:.45;pointer-events:none}
.slchips{display:flex;gap:6px;overflow-x:auto;margin:0 -16px;padding:2px 16px 4px;scrollbar-width:none}
.slchips::-webkit-scrollbar{display:none}
.slchips button{flex:none;min-height:34px;padding:0 12px;border-radius:999px;border:1px solid var(--hair);background:#fff;font:700 13px var(--sans);color:var(--ink);cursor:pointer;white-space:nowrap}
.slchips button span{color:var(--mid);font-weight:600;margin-right:5px;font-variant-numeric:tabular-nums}
.slchips button[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.slchips button[aria-pressed="true"] span{color:#CFC6C1}
.rw{display:inline-flex;align-items:center;gap:6px;align-self:flex-start;background:none;border:0;color:var(--teal);font:700 14px var(--sans);cursor:pointer;padding:4px 0}
.rw svg{width:16px;height:16px}
.edhint{font-size:12.5px;color:var(--mid);margin:-4px 0 0}
.msgbox textarea{min-height:230px;font-size:14px}
.planline{display:flex;justify-content:space-between;gap:10px;font-size:13px;color:var(--mid);font-weight:600}
.planline b{color:var(--ink)}
.bvbar{display:flex;flex-direction:column;gap:6px;background:#fff;border-radius:18px;padding:14px}
.bvbar .who{font-size:13.5px;color:var(--mid)}
.bvbar .who b{color:var(--ink)}
.bvbar h1{margin:0;font-size:20px;letter-spacing:-.03em;line-height:1.2}
.madewith{font-size:12.5px;color:var(--mid);text-align:center;margin:0}
.madewith b{color:var(--ink)}
.expl{display:flex;flex-direction:column;gap:10px}
.opt2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt2 button{min-height:78px;flex-direction:column;gap:4px;font-size:15px}
.opt2 button small{font-weight:600;font-size:12px;color:var(--mid)}
.b1 small{color:#FFE3E6!important}

/* ---------- slides (960x540 design size, scaled to fit) ---------- */
.slw{position:relative;width:100%;aspect-ratio:16/9;overflow:hidden;border-radius:10px;background:#FBF8F5;box-shadow:0 0 0 1px rgba(23,19,18,.08),0 18px 40px -28px rgba(23,19,18,.6)}
.slw.flat{box-shadow:0 0 0 1px rgba(23,19,18,.1)}
.sl{--sc-coral:#E23B4E;--sc-gold:#B8901A;--sc-ink:#171312;--sc-mid:#6F6560;--sc-hair:#E6DED7;--sc-paper:#FBF8F5;
  position:absolute;left:0;top:0;width:960px;height:540px;transform:scale(var(--k,.37));transform-origin:0 0;
  background:var(--sc-paper);color:var(--sc-ink);font-family:"Plus Jakarta Sans",system-ui,sans-serif;padding:44px 56px 0;display:flex;flex-direction:column;line-height:1.35;text-align:left}
.sl *{box-sizing:border-box}
.sl .se{margin:0;font-size:14px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--sc-coral)}
.sl .sh{margin:8px 0 0;font-size:36px;font-weight:800;letter-spacing:-.035em;line-height:1.1;max-width:820px;text-wrap:balance}
.sl .sbody{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;padding:18px 0 16px}
.sl .sfoot{height:52px;flex:none;border-top:1px solid var(--sc-hair);display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--sc-mid);font-weight:600}
.sl .sfoot .mw{color:var(--sc-ink)}
.sl .th{background:#d9d2cc center/cover no-repeat;border-radius:12px}
/* cover */
.s-cover{padding-top:0}
.s-cover .cg{flex:1;display:grid;grid-template-columns:1fr 300px;gap:36px;align-items:center;min-height:0}
.s-cover .sh{font-size:44px;margin-top:14px;line-height:1.05}
.s-cover .ssub{margin:18px 0 0;font-size:19px;color:var(--sc-mid);max-width:520px}
.s-cover .me{display:flex;align-items:center;gap:14px;margin-top:34px}
.s-cover .av{width:54px;height:54px;border-radius:50%;background:linear-gradient(135deg,#FFD3D8,#CFF1F2);display:grid;place-items:center;font-weight:800;font-size:22px}
.s-cover .me b{font-size:18px;display:block}
.s-cover .me span{font-size:15px;color:var(--sc-mid)}
.s-cover .stackth{position:relative;height:420px}
.s-cover .stackth .th{position:absolute;width:170px;height:280px;box-shadow:0 20px 40px -20px rgba(0,0,0,.45);border:5px solid #fff}
.s-cover .stackth .th:nth-child(1){left:0;top:10px}
.s-cover .stackth .th:nth-child(2){left:70px;top:60px}
.s-cover .stackth .th:nth-child(3){left:140px;top:110px}
.s-cover .sfoot{margin-top:0}
/* pattern */
.s-pat .prow{display:grid;grid-template-columns:78px 1fr;gap:20px;align-items:start;padding:22px 0;border-top:1px solid var(--sc-hair)}
.s-pat .prow:first-child{border-top:0;padding-top:4px}
.s-pat .prow i{font-style:normal;font-size:44px;font-weight:800;letter-spacing:-.04em;color:var(--sc-coral);line-height:1}
.s-pat .prow p{margin:0;font-size:25px;font-weight:700;letter-spacing:-.02em;line-height:1.3;max-width:720px}
.s-pat .src{margin:10px 0 0;font-size:14px;color:var(--sc-mid)}
/* proof */
.s-proof .pc3{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.s-proof .pcard{background:#fff;border-radius:16px;padding:12px;display:grid;grid-template-columns:96px 1fr;gap:14px;border:1px solid var(--sc-hair)}
.s-proof .pcard .th{width:96px;height:150px;border-radius:10px}
.s-proof .pcard .sc{display:flex;align-items:baseline;gap:6px}
.s-proof .pcard .sc b{font-size:34px;font-weight:800;color:var(--sc-gold);letter-spacing:-.04em;line-height:1}
.s-proof .pcard .sc span{font-size:11px;color:var(--sc-mid);font-weight:700;line-height:1.15}
.s-proof .pcard .h{font-size:13px;font-weight:700;margin-top:6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.s-proof .pcard .m{font-size:12.5px;color:var(--sc-mid);margin-top:2px}
.s-proof .pcard .wt{font-size:12px;font-weight:700;color:var(--sc-coral);margin-top:10px}
.s-proof .hq{grid-column:1/-1;margin:0;font-size:16px;font-weight:700;line-height:1.3;border-top:1px solid var(--sc-hair);padding-top:10px}
.s-proof .what{grid-column:1/-1;margin:0;font-size:14px;color:var(--sc-mid);line-height:1.35}
.s-proof .def{margin:16px 0 0;font-size:13px;color:var(--sc-mid)}
/* concepts */
.s-con .crow{display:grid;grid-template-columns:54px 1fr 220px;gap:18px;align-items:center;padding:17px 0;border-top:1px solid var(--sc-hair)}
.s-con .crow:first-child{border-top:0}
.s-con .crow i{font-style:normal;width:44px;height:44px;border-radius:12px;background:#FCE6EA;color:var(--sc-coral);display:grid;place-items:center;font-weight:800;font-size:19px}
.s-con .crow q{font-size:24px;font-weight:800;letter-spacing:-.025em;line-height:1.2;quotes:"\201C" "\201D"}
.s-con .crow small{display:block;font-size:14.5px;color:var(--sc-mid);margin-top:5px;font-weight:600}
.s-con .crow .fmt{font-size:14px;color:var(--sc-mid);line-height:1.4;border-left:1px solid var(--sc-hair);padding-left:16px}
.s-con .crow .fmt b{display:block;color:var(--sc-ink);font-size:15px}
/* why me */
.s-why .wg{display:grid;grid-template-columns:1.1fr 1fr;gap:44px;align-items:start}
.s-why .bio{margin:0;font-size:24px;font-weight:700;letter-spacing:-.02em;line-height:1.35}
.s-why .nums{display:flex;gap:34px;margin-top:26px}
.s-why .nums b{display:block;font-size:30px;font-weight:800;letter-spacing:-.03em;line-height:1}
.s-why .nums small{font-size:13px;color:var(--sc-mid);font-weight:600}
.s-why .lab{margin:0 0 10px;font-size:13px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--sc-mid)}
.s-why .links{list-style:none;margin:0 0 24px;padding:0;display:flex;flex-direction:column;gap:9px}
.s-why .links li{background:#fff;border:1px solid var(--sc-hair);border-radius:12px;padding:11px 14px;font-size:16px;font-weight:700;display:flex;justify-content:space-between}
.s-why .links li span{color:var(--sc-mid);font-weight:600;font-size:14px}
.s-why .work{margin:0;font-size:17px;line-height:1.45}
/* rates */
.s-rate .rg{display:grid;grid-template-columns:1fr 360px;gap:36px;align-items:stretch}
.s-rate table{border-collapse:collapse;width:100%;font-size:18px}
.s-rate td{padding:13px 0;border-bottom:1px solid var(--sc-hair)}
.s-rate td:last-child{text-align:right;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap;padding-left:16px}
.s-rate td small{display:block;font-size:13.5px;color:var(--sc-mid)}
.s-rate .turn{margin:14px 0 0;font-size:15px;color:var(--sc-mid)}
.s-rate .nx{background:var(--sc-ink);color:#fff;border-radius:18px;padding:26px 26px 24px;display:flex;flex-direction:column;gap:14px}
.s-rate .nx .se{color:#5EE0E3}
.s-rate .nx p{margin:0;font-size:22px;font-weight:700;letter-spacing:-.02em;line-height:1.3}
.s-rate .nx .em{margin-top:auto;background:#fff;color:var(--sc-ink);border-radius:12px;padding:13px 16px;font-size:16px;font-weight:800}
.s-rate .nx .em small{display:block;font-size:12px;color:var(--sc-mid);font-weight:600}

/* desktop editor */
.phone.desk .ded{display:grid;grid-template-columns:184px minmax(0,1fr) 330px;gap:26px;padding:24px 32px;align-items:start;flex:1;min-height:0}
.ded .thumbs{display:flex;flex-direction:column;gap:12px}
.ded .thumbs button{border:0;background:none;padding:0;cursor:pointer;display:flex;flex-direction:column;gap:5px;text-align:left;font:600 12px var(--sans);color:var(--mid)}
.ded .thumbs button .slw{border-radius:7px;outline:2.5px solid transparent;outline-offset:2px}
.ded .thumbs button[aria-pressed="true"] .slw{outline-color:var(--coral)}
.ded .thumbs button[aria-pressed="true"]{color:var(--ink)}
.ded .canvas{display:flex;flex-direction:column;gap:12px}
.ded .panel{background:#fff;border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:14px;border:1px solid rgba(23,19,18,.05)}
.ded .panel h3{margin:0;font-size:16px}
.ded .cnote{font-size:13px;color:var(--mid);margin:0}
.dtb .dt{font-weight:800;font-size:16px;letter-spacing:-.02em}
.dtb .saved{font-size:12.5px;color:var(--mid);font-weight:600}
.dtb .b{min-height:42px;font-size:14.5px;padding:0 16px}

[hidden]{display:none!important}img{max-width:100%}
</style>

(function(){
"use strict";

/* ---------------- sample data (invented brand, placeholder handles) ---------------- */

var SPEC='<div class="whead"><h2>Spec for Lester</h2><p>Short build notes for the pitch deck generator. Every number here is a proposal until Ivan confirms it.</p></div><div class="spec">'+

'<tr><td>2 or 3 breakouts</td><td>The creator\'s search results</td><td>Video id, handle, followers, views, Breakout Score, hook text, and the existing analysis (hooks, why it worked). Analyze any unanalyzed pick first, and don\'t count it against the analysis cap.</td></tr>'+
'<tr><td>Category pattern</td><td>The same search</td><td>Count of breakouts in the search plus the top hooks, for the pattern slide.</td></tr>'+

'<h3>Generation</h3><p>One Claude API call with <code>claude-sonnet-5</code>, structured output, no tools. Target under 20 seconds.</p>'+
'<pre>System: You write short UGC pitch decks for US TikTok creators.\nRules: American spelling. TikTok only. Call these videos breakouts.\nNo em dashes or en dashes. Plain slide titles.\nNever state a fact about the brand (sales, audience, ads, founders)\nthat is not in the input. Only use numbers that are in the input.\n\nInput (JSON): brand, product, category, creator profile,\npicked breakouts with their analyses, category pattern.\n\nReturn JSON:\n  cover.title (max 12 words), cover.sub (max 30 words)\n  pattern.title, pattern.p1, pattern.p2 (max 22 words each)\n  proof.title, proof.what[i] (max 14 words, one per breakout)\n  concepts[3]: hook (max 12 words), format, length, based_on (index)\n  about.bio (max 25 words)\n  next_step (max 22 words)</pre>'+
'<p>Stats, handles, scores and rates are never generated. They are filled in from our data and the profile. “Rewrite this slide” sends that slide\'s JSON back with the same rules and returns one replacement.</p>'+
'<h3>Export</h3><ul><li><b>Link:</b> <code>ugcbreakouts.com/p/{slug}</code>, public, noindex, rendered from the slides JSON. Reply opens a mailto to the creator\'s reply email.</li><li><b>PDF:</b> render the same page at 1920 by 1080 per slide with headless Chromium (Playwright <code>page.pdf</code>), store it, return a download URL. Regenerate on edit.</li><li>Proof cards link to the video on TikTok. See the thumbnail risk below.</li></ul>'+
'<h3>Limits per plan</h3><table><tr><th></th><th>Free</th><th>Pro $49/mo</th></tr><tr><td>Pitch decks</td><td>1</td><td>20 a month</td></tr><tr><td>Rewrites</td><td>5 per deck</td><td>Unlimited, with a soft cap of 30 per deck for cost</td></tr><tr><td>“Made with UGC Breakouts” line</td><td>On the last slide and the link page</td><td>Off</td></tr><tr><td>PDF and link</td><td>Yes</td><td>Yes</td></tr></table><p>A deck counts when generation finishes, the same way a search counts when results arrive.</p>'+
'<h3>Risks</h3><ul>'+
'<li><b>Other creators\' videos in the deck.</b> TikTok\'s US Terms bar using another user\'s content for commercial purposes without their permission, and bar scraping except as approved in writing. The Display API only returns the signed-in user\'s own videos. Safest: no stored thumbnails in the PDF, and on the link page use TikTok\'s official embed or a plain link. Needs Ivan\'s call before build. <a href="https://www.tiktok.com/legal/page/us/terms-of-service/en" target="_blank" rel="noopener">Terms</a> · <a href="https://developers.tiktok.com/docs/en/display-api-get-started" target="_blank" rel="noopener">Display API</a> · <a href="https://developers.tiktok.com/docs/en/embed-videos" target="_blank" rel="noopener">Embeds</a></li>'+
