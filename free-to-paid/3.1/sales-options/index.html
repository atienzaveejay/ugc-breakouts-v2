<h1>UB sales page: options for the middle</h1><p>The headline and everything from “Who it’s for” down stay as they are. Each option replaces the part in between, and every screen in A to D is a real capture from the UB 3.1 prototype, so it matches the app.</p>
<div class="g"><figure><figcaption><b>Now</b><span>The current middle: a drawn hero card, how it works, a dark breakdown box and a top-breakouts band. Ivan: these don’t match the app.</span></figcaption><img src="sales.jpg" alt="Now" loading="lazy"></figure><figure><figcaption><b>A · Walkthrough</b><span>Three steps, each with a real screen from the app: search, results, the breakdown.</span><a href="../#sales-a">Try it in the prototype</a></figcaption><img src="sales-a.jpg" alt="A · Walkthrough" loading="lazy"></figure><figure><figcaption><b>B · Swipe the app</b><span>Six real screens in order, in a row she can swipe: results, Analyze, analyzing, hook, script, next search.</span><a href="../#sales-b">Try it in the prototype</a></figcaption><img src="sales-b.jpg" alt="B · Swipe the app" loading="lazy"></figure><figure><figcaption><b>C · Try it</b><span>A live demo built from the app’s own parts. Tap a result, it analyzes for a few seconds, then shows the breakdown. No sign up needed.</span><a href="../#sales-c">Try it in the prototype</a></figcaption><img src="sales-c.jpg" alt="C · Try it" loading="lazy"></figure><figure><figcaption><b>D · Proof</b><span>One real breakout as a story (18K usual to 1.4M), what you get with real screens, then a creator reviews row (samples for now).</span><a href="../#sales-d">Try it in the prototype</a></figcaption><img src="sales-d.jpg" alt="D · Proof" loading="lazy"></figure></div></div></body></html>
