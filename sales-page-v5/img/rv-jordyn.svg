<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <rect width="160" height="160" fill="#CFE2F3"/>
  <!-- hair back -->
  <path d="M38 78c0-34 18-54 42-54s42 20 42 54v52H38z" fill="#2E1F1B"/>
  <!-- shoulders / top -->
  <path d="M26 160c2-26 24-40 54-40s52 14 54 40z" fill="#F2A7B4"/>
  <path d="M68 118h24l-2 12c-4 4-16 4-20 0z" fill="#C98D6B"/>
  <!-- neck -->
  <rect x="70" y="100" width="20" height="24" rx="6" fill="#D99C76"/>
  <!-- face -->
  <ellipse cx="80" cy="78" rx="27" ry="31" fill="#E4AE86"/>
  <!-- ears + hoops -->
  <ellipse cx="53" cy="82" rx="5" ry="7" fill="#D99C76"/>
  <ellipse cx="107" cy="82" rx="5" ry="7" fill="#D99C76"/>
  <circle cx="53" cy="93" r="4.5" fill="none" stroke="#E8C15A" stroke-width="2"/>
  <circle cx="107" cy="93" r="4.5" fill="none" stroke="#E8C15A" stroke-width="2"/>
  <!-- hair front: side part with swoop -->
  <path d="M52 74c2-24 16-36 32-36 18 0 28 14 26 32-10-2-22-10-28-20-6 12-18 20-30 24z" fill="#2E1F1B"/>
  <!-- brows -->
  <path d="M65 71q6-4 12-1" stroke="#2E1F1B" stroke-width="2.4" fill="none" stroke-linecap="round"/>
  <path d="M84 70q6-3 12 1" stroke="#2E1F1B" stroke-width="2.4" fill="none" stroke-linecap="round"/>
  <!-- eyes -->
  <ellipse cx="71" cy="80" rx="3" ry="3.6" fill="#2A1C18"/>
  <ellipse cx="90" cy="80" rx="3" ry="3.6" fill="#2A1C18"/>
  <circle cx="72" cy="79" r="1" fill="#fff"/><circle cx="91" cy="79" r="1" fill="#fff"/>
  <!-- blush -->
  <ellipse cx="64" cy="91" rx="5" ry="3" fill="#E98C86" opacity=".45"/>
  <ellipse cx="97" cy="91" rx="5" ry="3" fill="#E98C86" opacity=".45"/>
  <!-- nose + smile -->
  <path d="M80 84q-2 5 1 6" stroke="#B97C5A" stroke-width="1.8" fill="none" stroke-linecap="round"/>
  <path d="M71 96q9 8 18 0" stroke="#9E4A45" stroke-width="2.6" fill="none" stroke-linecap="round"/>
</svg>
