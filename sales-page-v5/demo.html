<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>UGC Breakouts sample screen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<!-- Built from magic-moments-v2-2026-11-09/index.html (screens + motion primitives), sliced by mkdemo.py. Edit the source there, not here. -->
<style>
:root{
  --page:#ECE7E2; --page-ink:#2A2321; --page-mid:#6F6560; --page-line:#D6CDC5;
  --paper:#F6F2EE; --card:#FFFFFF; --ink:#171312; --mid:#6F6560; --soft:#9A908A; --hair:#E8E0D9; --track:#ECE5DF;
  --coral:#FF4F5E; --red:#D8304A; --coral-soft:#FFE6E8; --teal:#0B7B7F; --teal-soft:#E2F3F3;
  --sans:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --out:cubic-bezier(.2,.7,.2,1); --snap:cubic-bezier(.3,0,.15,1);
}
*{box-sizing:border-box}
html,body{margin:0}
*{box-sizing:border-box}
html,body{margin:0;background:transparent;overflow:hidden}
body{font-family:var(--sans);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;color:var(--ink)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
.num{font-variant-numeric:tabular-nums}
.phone{width:414px;height:868px;padding:12px;border-radius:52px;background:#111;box-shadow:0 1px 0 #333 inset;transform-origin:0 0;cursor:pointer}
.screen{position:relative;width:390px;height:844px;border-radius:40px;overflow:hidden;background:var(--paper)}
.screen>.app{transition:opacity .18s linear}
.screen.swap>.app{opacity:0}
/* ---------- app ---------- */
.app{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--paper);color:var(--ink);font-family:var(--sans)}
.sb{height:44px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 28px 0 34px;font-size:15px;font-weight:600}
.sb i{display:inline-block;width:24px;height:11px;border:1.5px solid var(--ink);border-radius:3px;position:relative}
.sb i::after{content:"";position:absolute;inset:1.5px;right:5px;background:var(--ink);border-radius:1px}
.body{flex:1;overflow:hidden;position:relative}
.nav{flex:none;height:78px;display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--hair);background:#fff;padding-bottom:18px}
.nav a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11.5px;font-weight:600;color:var(--soft);position:relative}
.nav a.on{color:var(--ink)}
.nav a.on::before{content:"";position:absolute;top:-1px;left:50%;width:28px;margin-left:-14px;height:3px;background:var(--coral)}
.nav svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ic{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.brandbar{display:flex;align-items:center;justify-content:space-between;padding:4px 20px 6px;height:44px}
.logo{display:flex;align-items:center;gap:7px;font-weight:700;font-size:18px;letter-spacing:-.02em}
.logo .mk{width:24px;height:24px;border-radius:6px;background:var(--coral);display:grid;place-items:center}
.logo .mk svg{width:14px;height:14px;stroke:#fff;stroke-width:2.6;fill:none;stroke-linecap:round;stroke-linejoin:round}
.logo b{color:var(--coral);font-weight:700}
.av{width:34px;height:34px;border-radius:50%;background:var(--red);color:#fff;display:grid;place-items:center;font-weight:700;font-size:15px;flex:none}
.login{font-size:15px;font-weight:600}
.bk{display:flex;align-items:center;gap:10px;height:40px;padding:0 16px;font-size:17px;font-weight:700}
.th{background:#ddd center/cover;border-radius:4px;flex:none;position:relative}
.dur{position:absolute;right:5px;bottom:5px;background:rgba(0,0,0,.65);color:#fff;font-size:11px;font-weight:700;padding:1px 4px;border-radius:3px}
.btn{height:54px;border-radius:8px;display:flex;align-items:center;justify-content:center;gap:9px;font-weight:700;font-size:17px;position:relative}
.btn.p{background:var(--red);color:#fff}
.btn.k{background:var(--ink);color:#fff}
.btn.w{background:#fff;color:var(--ink);border:1px solid var(--hair)}
.free{font-size:14px;font-weight:700;color:var(--teal)}

/* shared motion primitives */
.rv{opacity:0;transform:translateY(8px)}
.go .rv{animation:rv .3s var(--out) var(--d,0ms) both}
@keyframes rv{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.fd{opacity:0}
.go .fd{animation:fd .22s linear var(--d,0ms) both}
@keyframes fd{from{opacity:0}to{opacity:1}}
.wd,.ch{opacity:0}
.go .wd{animation:fd .16s linear var(--d,0ms) both}
.go .ch{animation:on 1ms linear var(--d,0ms) both}
@keyframes on{from{opacity:0}to{opacity:1}}
.caret{display:inline-block;width:2.5px;height:1.05em;background:var(--teal);vertical-align:-.15em;margin-left:2px}
.go .caret{animation:off 1ms linear var(--d,0ms) both}
.go .phd{animation:off 1ms linear var(--d,0ms) both}
@keyframes off{from{opacity:1}to{opacity:0}}
.go .press{animation:press .26s ease var(--d,0ms) both}
@keyframes press{0%{transform:none;filter:none}40%{transform:scale(.96);filter:brightness(.88)}100%{transform:none;filter:none}}
.tap{position:absolute;left:50%;top:50%;width:64px;height:64px;margin:-32px 0 0 -32px;border-radius:50%;background:rgba(23,19,18,.18);border:2px solid rgba(255,255,255,.7);opacity:0;pointer-events:none;z-index:3}
.go .tap{animation:tap .42s var(--out) var(--d,0ms) both}
@keyframes tap{0%{opacity:0;transform:scale(.35)}25%{opacity:1}100%{opacity:0;transform:scale(1.3)}}
.go .lock{animation:lock .2s var(--out) var(--d,0ms) both}
@keyframes lock{from{border-color:var(--hair);box-shadow:0 0 0 0 transparent}to{border-color:var(--teal);box-shadow:0 0 0 4px var(--teal-soft)}}
.go .chipon{animation:chipon .2s var(--out) var(--d,0ms) both}
@keyframes chipon{from{background:#fff;color:var(--ink);border-color:var(--hair)}to{background:var(--teal);color:#fff;border-color:var(--teal)}}
/* proof underline: the final settle of every output */
.ul{position:relative;display:inline-block}
.ul::after{content:"";position:absolute;left:0;right:0;bottom:-5px;height:5px;background:var(--coral);border-radius:1px;transform:scaleX(0);transform-origin:0 50%}
.go .ul::after{animation:fill .28s var(--snap) var(--u,1000ms) both}
@keyframes fill{from{transform:scaleX(0)}to{transform:none}}
.go .grow{animation:fill var(--t,.8s) var(--snap) var(--d,0ms) both}
.grow{transform:scaleX(0);transform-origin:0 50%}

/* ---------- INPUT beats ---------- */
.inpad{padding:6px 20px 0}
.inpad h1{margin:6px 0 14px;font-size:32px;line-height:1.12;letter-spacing:-.025em;font-weight:800}
.lede{margin:0 0 18px;font-size:17px;line-height:1.4;color:var(--mid)}
.fld{position:relative;height:68px;border:2px solid var(--hair);background:#fff;border-radius:8px;display:flex;align-items:center;gap:12px;padding:0 8px 0 16px}
.fld .ic{width:24px;height:24px;color:var(--soft)}
.fld .val{position:relative;flex:1;font-size:26px;font-weight:700;letter-spacing:-.02em;white-space:nowrap}
.fld .phd{position:absolute;left:0;top:50%;transform:translateY(-50%);color:var(--soft);font-weight:500;font-size:19px;letter-spacing:0}
.fld .go2{position:relative;width:50px;height:50px;border-radius:6px;background:var(--red);display:grid;place-items:center;color:#fff;flex:none}
.fld .go2 .ic{color:#fff;width:22px;height:22px}
.try{margin:12px 0 0;font-size:14px;color:var(--mid);white-space:nowrap;overflow:hidden}
.try b{color:var(--ink);font-weight:600;margin-left:10px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{height:40px;padding:0 14px;border:1.5px solid var(--hair);background:#fff;border-radius:6px;display:inline-flex;align-items:center;font-weight:700;font-size:16px}
.tabs{display:flex;gap:20px;border-bottom:1px solid var(--hair);white-space:nowrap;overflow:hidden;font-size:16px;font-weight:700;color:var(--mid);margin:0 0 14px}
.tabs span{padding:8px 0 10px;flex:none;position:relative}
.tabs .on{color:var(--ink)}
.tabs .on::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:3px;background:var(--ink);transform:scaleX(0);transform-origin:0 50%}
.go .tabs .on::after{animation:fill .25s var(--snap) var(--d,0ms) both}
.lbl2{font-size:14px;color:var(--mid);font-weight:600;margin:0 0 8px}
.flt{display:flex;gap:10px;margin-top:16px}
.flt span{position:relative;height:44px;padding:0 14px;border:1.5px solid var(--hair);background:#fff;border-radius:6px;display:inline-flex;align-items:center;gap:6px;font-weight:700;font-size:16px}
.opt{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--hair);border-radius:8px;padding:14px;margin-bottom:10px}
.opt .oi{width:40px;height:40px;border-radius:6px;background:var(--teal-soft);color:var(--teal);display:grid;place-items:center;flex:none}
.opt b{display:block;font-size:17px}
.opt small{display:block;color:var(--mid);font-size:13.5px;line-height:1.35}
.opt.big{display:block;border:2px solid var(--teal);padding:14px 14px 16px}
.opt.big .fld{margin:12px 0 10px;height:60px}
.opt.big .fld .val{font-size:24px}
.ttbtn svg{width:20px;height:20px;fill:#fff}
.conn{display:flex;align-items:center;gap:12px;margin-top:14px;background:#fff;border:1px solid var(--hair);border-radius:8px;padding:12px 14px}
.conn b{display:block;font-size:18px}
.conn small{color:var(--mid);font-size:14px}
.conn .ok{margin-left:auto;width:30px;height:30px;border-radius:50%;background:var(--teal);color:#fff;display:grid;place-items:center}
.conn .ok .ic{width:16px;height:16px;stroke-width:3}
.priv{display:block;margin-top:12px;font-size:13.5px;color:var(--mid);text-align:center}
.vhero{margin:0 16px;height:228px;border-radius:8px}
.vrow{display:grid;grid-template-columns:1fr auto auto;gap:18px;align-items:end;padding:14px 20px 10px}
.vrow b{display:block;font-size:22px;letter-spacing:-.02em;font-weight:800}
.vrow small{color:var(--mid);font-size:13.5px}
.vrow .sc b{color:var(--red)}
.vstats{display:flex;gap:18px;padding:10px 20px 12px;border-top:1px solid var(--hair);border-bottom:1px solid var(--hair);margin:0 20px;padding-left:0;padding-right:0;font-size:13px;color:var(--mid)}
.vstats b{display:block;color:var(--ink);font-size:16px}
.bta{position:relative;background:#fff;border:2px solid var(--hair);border-radius:8px;padding:14px 16px;min-height:228px;font-size:16px;line-height:1.5;overflow:hidden}
.bta .phd{position:absolute;left:16px;top:14px;color:var(--soft)}
.bta .txt{white-space:pre-line;clip-path:inset(0 0 100% 0)}
.go .bta .txt{animation:unroll .34s var(--snap) var(--d,0ms) both}
@keyframes unroll{from{clip-path:inset(0 0 100% 0)}to{clip-path:inset(0 0 0 0)}}
.bta .txt b{font-weight:700}

/* ---------- PROCESSING beat (shared) ---------- */
.pr{padding:14px 20px 0}
.ptok{display:flex;align-items:center;gap:10px;height:44px;font-size:15px;color:var(--mid);font-weight:600;white-space:nowrap;overflow:hidden}
.ptok .th{width:34px;height:44px}
.ptok .ti{width:36px;height:36px;border-radius:6px;background:#fff;border:1px solid var(--hair);display:grid;place-items:center;color:var(--ink);flex:none}
.ptok b{color:var(--ink);font-size:16px}
.pline{display:flex;align-items:center;gap:10px;margin:14px 0 14px;min-height:40px}
.pline h2{margin:0;font-size:30px;line-height:1.12;letter-spacing:-.025em;font-weight:800}
.pdone{width:32px;height:32px;border-radius:50%;background:var(--teal);color:#fff;display:grid;place-items:center;flex:none;opacity:0;transform:scale(.6)}
.pdone .ic{width:18px;height:18px;stroke-width:3}
.go .pdone{animation:settle .22s cubic-bezier(.2,.9,.3,1) var(--d,1780ms) both}
@keyframes settle{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}
.pbar{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;height:12px}
.pbar span{background:var(--track);border-radius:3px;overflow:hidden}
.pbar i{display:block;height:100%;background:var(--teal);transform:scaleX(0);transform-origin:0 50%}
.go .pbar i{animation:fill .48s cubic-bezier(.45,0,.25,1) var(--d) both}
.plab{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin:10px 0 0;padding:0;list-style:none}
.plab li{display:flex;flex-direction:column;gap:5px;min-width:0}
.plab .dot{position:relative;width:18px;height:18px;border-radius:50%;border:2px solid #D6CDC5}
.plab .dot i{position:absolute;inset:-2px;border-radius:50%;opacity:0}
.plab .dot .rg{border:2px solid var(--teal)}
.plab .dot .ok{background:var(--teal);display:grid;place-items:center;transform:scale(.5)}
.plab .dot .ok .ic{width:11px;height:11px;stroke:#fff;stroke-width:3.4}
.go .plab .rg{animation:on 1ms linear var(--d) both}
.go .plab .ok{animation:settle .16s var(--out) var(--e) both}
.plab .t{font-size:14px;line-height:1.25;font-weight:700;color:var(--soft)}
.go .plab .t{animation:ink 1ms linear var(--d) both}
@keyframes ink{from{color:var(--soft)}to{color:var(--ink)}}
.plab .val{font-size:13px;font-weight:600;color:var(--teal);opacity:0}
.go .plab .val{animation:fd .2s linear var(--e) both}
.prd{display:flex;align-items:baseline;justify-content:space-between;margin:14px 0 0;padding:10px 0 0;border-top:1px solid var(--hair);font-size:15px;color:var(--mid);font-weight:600}
.prd b{font-size:24px;color:var(--ink);letter-spacing:-.02em;font-weight:800}
.pmat{position:relative;margin-top:14px;background:#fff;border:1px solid var(--hair);border-radius:8px;padding:10px;overflow:hidden}
.pscan{position:absolute;left:0;right:0;top:0;height:2px;background:var(--teal);box-shadow:0 0 10px 2px rgba(11,123,127,.35);opacity:0;z-index:4}
.go .pscan{animation:scan 1.55s cubic-bezier(.4,0,.2,1) 150ms both}
@keyframes scan{0%{opacity:1;top:0}92%{opacity:1}100%{opacity:0;top:100%}}
.pscan.v{top:0;bottom:0;left:0;right:auto;width:3px;height:auto}
.go .pscan.v{animation:scanx 1.55s linear 150ms both}
@keyframes scanx{0%{opacity:1;left:0}95%{opacity:1}100%{opacity:0;left:100%}}
.mi{opacity:.4;filter:grayscale(1)}
.go .mi{animation:read .2s linear var(--d) both}
@keyframes read{from{opacity:.4;filter:grayscale(1)}to{opacity:1;filter:none}}
.pnote{position:absolute;left:20px;right:56px;top:470px;margin:0;font-size:15px;line-height:1.4;color:var(--mid);text-align:center}
/* material variants */
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.tile{position:relative;height:86px;border-radius:4px;background:#ddd center/cover}
.tile em{position:absolute;left:4px;bottom:4px;font-style:normal;font-size:11.5px;font-weight:700;color:#fff;background:rgba(0,0,0,.6);padding:1px 4px;border-radius:3px}
.tile .stamp{position:absolute;left:4px;top:4px;font-style:normal;font-size:11px;font-weight:800;color:#fff;background:var(--red);padding:2px 5px;border-radius:3px;opacity:0}
.go .tile .stamp{animation:settle .18s cubic-bezier(.2,.9,.3,1) var(--e) both}
.tile.bo{outline:3px solid transparent;outline-offset:-3px}
.go .tile.bo{animation:read .2s linear var(--d) both,bo .18s linear var(--e) both}
@keyframes bo{to{outline-color:var(--red)}}
.tiles.six{grid-template-columns:repeat(6,1fr)}
.tiles.six .tile{height:70px}
.skr{display:grid;grid-template-columns:22px 44px 1fr;gap:10px;align-items:center;padding:6px 0;border-top:1px solid var(--hair)}
.skr:first-child{border-top:0}
.skr .n{font-weight:800;font-size:16px;color:var(--soft)}
.skr .th{width:44px;height:56px}
.skr .ln{display:flex;flex-direction:column;gap:7px}
.skr .ln i{display:block;height:10px;border-radius:2px;background:var(--track)}
.ing{display:grid;grid-template-columns:36px 1fr 24px;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--hair)}
.ing:first-child{border-top:0}
.ing .oi{width:36px;height:36px;border-radius:6px;background:var(--teal-soft);color:var(--teal);display:grid;place-items:center}
.ing small{display:block;font-size:12.5px;color:var(--mid);font-weight:600}
.ing b{display:block;font-size:16px}
.ing .ck{width:22px;height:22px;border-radius:50%;background:var(--teal);color:#fff;display:grid;place-items:center;opacity:0;transform:scale(.5)}
.ing .ck .ic{width:12px;height:12px;stroke-width:3.4}
.go .ing .ck{animation:settle .16s var(--out) var(--e) both}
.film{position:relative;display:grid;grid-template-columns:repeat(6,1fr);gap:3px;height:96px}
.film span{background:#ddd center/cover;border-radius:3px}
.ftime{display:flex;justify-content:space-between;margin-top:8px;font-size:13px;font-weight:700;color:var(--mid)}
.ftime b{color:var(--ink)}
.hooktag{background:none!important;position:absolute;left:0;top:-1px;bottom:-1px;width:16.67%;border:3px solid var(--coral);border-radius:4px;opacity:0;z-index:3}
.hooktag em{position:absolute;left:-3px;top:-24px;font-style:normal;white-space:nowrap;font-size:12px;font-weight:800;color:#fff;background:var(--coral);padding:2px 6px;border-radius:3px}
.go .hooktag{animation:settle .2s cubic-bezier(.2,.9,.3,1) var(--e) both}
.film.mt{margin-top:22px}
.brief{font-size:14.5px;line-height:1.4}
.brief .bl{overflow:hidden;max-height:44px;padding:2px 4px;border-radius:3px}
.brief .bl b{font-weight:700}
.go .brief .bl.x{animation:collapse .3s var(--snap) var(--d) both}
@keyframes collapse{from{max-height:44px;opacity:1}to{max-height:0;opacity:0;padding-top:0;padding-bottom:0}}
.brief .bl.k{background-image:linear-gradient(var(--coral-soft),var(--coral-soft));background-repeat:no-repeat;background-size:0 100%}
.go .brief .bl.k{animation:hl .32s var(--snap) var(--d) both}
@keyframes hl{to{background-size:100% 100%}}

/* ---------- OUTPUT beats ---------- */
/* 1 video card */
.vchd{padding:2px 20px 10px}
.vchd h1{margin:0 0 2px;font-size:26px;line-height:1.15;letter-spacing:-.02em;font-weight:800}
.vchd .sub{display:flex;justify-content:space-between;font-size:14px;color:var(--mid)}
.vchd .sub b{color:var(--ink);font-weight:600}
.vc{margin:0 16px 12px;background:#fff;border:1px solid var(--hair);border-radius:8px;overflow:hidden}
.vc .in{padding:14px 16px 12px}
.who{display:flex;align-items:baseline;gap:8px;font-size:14.5px}
.who .rk{font-weight:800}
.who .h{font-weight:700}
.who .f{color:var(--mid)}
.vc .big{display:flex;align-items:flex-end;justify-content:space-between;margin-top:6px}
.vc .views{display:flex;align-items:baseline;gap:8px}
.vc .views b{font-size:66px;line-height:.95;font-weight:800;letter-spacing:-.035em}
.vc .views span{font-size:17px;color:var(--mid);font-weight:600}
.vc .sc{text-align:right}
.vc .sc b{display:block;font-size:36px;line-height:1;font-weight:800;color:var(--red);letter-spacing:-.02em}
.vc .sc span{font-size:12px;color:var(--mid);font-weight:600}
.bars{margin-top:14px;display:flex;flex-direction:column;gap:7px}
.bar{display:grid;grid-template-columns:1fr 96px;align-items:center;gap:10px;font-size:13px}
.bar .tr{height:12px;background:var(--track);border-radius:2px;overflow:hidden}
.bar .tr i{display:block;height:100%;border-radius:2px;transform:scaleX(0);transform-origin:0 50%}
.bar.t .tr i{background:var(--coral);width:100%}
.bar.u .tr i{background:var(--soft);width:max(4px,1.3%)}
.bar span{color:var(--mid)}
.bar span b{color:var(--ink);font-weight:700}
.go .bar.t .tr i{animation:fill .9s var(--snap) var(--d,350ms) both}
.go .bar.u .tr i{animation:fill .25s var(--snap) var(--d,200ms) both}
.mult{margin:14px 0 0;font-size:16px;color:var(--mid)}
.mult b{font-size:28px;color:var(--ink);font-weight:800;letter-spacing:-.02em;margin-right:4px}
.vc .hk{display:grid;grid-template-columns:70px 1fr;gap:12px;margin-top:16px;padding-top:14px;border-top:1px solid var(--hair)}
.vc .hk .th{width:70px;height:92px}
.q{margin:0;font-size:18px;line-height:1.3;font-weight:700;letter-spacing:-.01em}

function count(el){
 var to=+el.getAttribute("data-count"),at0=+el.getAttribute("data-at")||0,dur=+el.getAttribute("data-dur")||700,f=el.getAttribute("data-f"),lin=el.getAttribute("data-lin");
 if(staticMode){el.textContent=fmtF(to,f);return;}

 function step(ts){if(!el.isConnected)return;if(t0===null)t0=ts;var p=(ts-t0-at0)/dur;if(p<0){requestAnimationFrame(step);return;}p=Math.min(1,p);
  var e=lin?p:1-Math.pow(1-p,3);el.textContent=fmtF(to*e,f);if(p<1)requestAnimationFrame(step);else el.textContent=fmtF(to,f);}
