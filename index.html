<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>UGC Breakouts v2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
:root{
  --ground:#DCE4E3; --surface:#EEF3F2; --wink:#12201F; --wmuted:#4F5E5C; --wline:#C2CECC; --hover:#E3EBEA;
  --acc:#0B6F73; --t-slack:#0B6F73; --t-slack-bg:#CFE6E5; --t-new:#7A4E00; --t-new-bg:#F1E3C4;
  --t-ask:#A8243A; --t-ask-bg:#F5D9DD; --t-ivan:#5B3FB0; --t-ivan-bg:#E4DDF6;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --sans:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#0F1616; --surface:#172121; --wink:#E3ECEB; --wmuted:#98A8A6; --wline:#2B3A39; --hover:#1F2B2B;
    --acc:#5ED6D9; --t-slack:#7FE0E2; --t-slack-bg:#163536; --t-new:#E8BE62; --t-new-bg:#3A2E14;
    --t-ask:#FF97A2; --t-ask-bg:#40202A; --t-ivan:#C3B1FF; --t-ivan-bg:#2B2447;
  }
}
:root[data-theme="dark"]{
  --ground:#0F1616; --surface:#172121; --wink:#E3ECEB; --wmuted:#98A8A6; --wline:#2B3A39; --hover:#1F2B2B;
  --acc:#5ED6D9; --t-slack:#7FE0E2; --t-slack-bg:#163536; --t-new:#E8BE62; --t-new-bg:#3A2E14;
  --t-ask:#FF97A2; --t-ask-bg:#40202A; --t-ivan:#C3B1FF; --t-ivan-bg:#2B2447;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{background:var(--ground);color:var(--wink);font-family:var(--sans);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;margin:0}
.i{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* ---------- shell ---------- */
.shell{display:grid;grid-template-columns:268px minmax(0,1fr);min-height:100vh}
.rail{background:var(--surface);border-right:1px solid var(--wline);height:100vh;position:sticky;top:0;overflow-y:auto;padding:24px 14px 28px;display:flex;flex-direction:column;gap:18px}
.brand{padding:0 8px}
.kicker{font-family:var(--mono);font-size:11.5px;color:var(--acc);margin:0 0 6px}
.brand h1{margin:0;font-size:26px;line-height:1;letter-spacing:-.045em;font-weight:800}
.brand h1 b{color:var(--acc)}
.brand p{margin:8px 0 0;font-size:12.5px;color:var(--wmuted);line-height:1.45}
#rail-groups{display:flex;flex-direction:column;gap:18px}
.grp{display:flex;flex-direction:column;gap:2px}
.grp h2{font-family:var(--mono);font-size:10.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--wmuted);margin:0 0 4px;padding:0 10px}
.grp button{display:flex;gap:10px;align-items:baseline;text-align:left;border:1px solid transparent;background:transparent;border-radius:9px;padding:7px 10px;font:600 13.5px/1.3 var(--sans);color:var(--wink);cursor:pointer}
.grp button span{font-family:var(--mono);font-size:11px;color:var(--wmuted);min-width:26px;font-weight:500}
.grp button:hover{background:var(--hover)}
.grp button.on{background:var(--wink);color:var(--ground)}
.grp button.on span{color:var(--ground);opacity:.75}
.grp button:focus-visible,.mnav select:focus-visible,.stagebar button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}

.main{display:flex;flex-wrap:wrap;justify-content:center;align-items:flex-start;gap:32px 40px;padding:20px clamp(16px,3vw,40px) 48px}
.stage{position:sticky;top:20px;display:flex;flex-direction:column;align-items:center;gap:12px;width:min(390px,100%)}
.stagebar{display:flex;gap:8px;align-items:center;justify-content:space-between;width:100%;min-height:32px}
.stagebar .where{font-family:var(--mono);font-size:12px;color:var(--wmuted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stagebar .ctl{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.stagebar button{font:600 12px var(--sans);color:var(--wink);background:var(--surface);border:1px solid var(--wline);border-radius:7px;padding:5px 9px;cursor:pointer;white-space:nowrap}
.stagebar button:hover{border-color:var(--acc)}

.notes{width:min(400px,100%);display:flex;flex-direction:column;gap:14px;padding-top:44px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--wmuted);padding-bottom:14px;border-bottom:1px solid var(--wline)}
.tag{font-family:var(--mono);font-size:10.5px;font-weight:600;letter-spacing:.03em;padding:2px 6px;border-radius:5px;white-space:nowrap}
.tag.s{color:var(--t-slack);background:var(--t-slack-bg)}
.tag.n{color:var(--t-new);background:var(--t-new-bg)}
.tag.a{color:var(--t-ask);background:var(--t-ask-bg)}
.tag.r{color:var(--t-ivan);background:var(--t-ivan-bg)}
.tag.c{color:var(--t-new);background:var(--t-new-bg)}
.tag.q{color:var(--t-slack);background:var(--t-slack-bg)}
.tag.v{color:var(--wink);background:var(--wline)}
.tag.f{color:var(--t-ask);background:transparent;box-shadow:inset 0 0 0 1px var(--t-ask)}
.tag.d{color:var(--wmuted);background:transparent;box-shadow:inset 0 0 0 1px var(--wline)}
.sid{font-family:var(--mono);font-size:12.5px;color:var(--acc);margin:0}
.notes h2{margin:0;font-size:28px;line-height:1.05;letter-spacing:-.035em;text-wrap:balance}
.notes .why{margin:0;color:var(--wmuted);font-size:14.5px}
.try{margin:0;font-size:13.5px;background:var(--surface);border:1px solid var(--wline);border-radius:10px;padding:10px 12px}
.try b{font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;color:var(--acc);margin-right:6px}
.notes ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:9px}
.notes li{display:grid;grid-template-columns:58px 1fr;gap:10px;font-size:14px;line-height:1.5;align-items:baseline}
.notes li .tag{justify-self:start}
.notes ol{margin:0;padding-left:1.3em;display:flex;flex-direction:column;gap:10px;font-size:14px}
.notes ol li{display:list-item}
.notes ol li::marker{font-family:var(--mono);color:var(--acc);font-size:12px}

.mnav{display:none}
@media (max-width:820px){
  .shell{grid-template-columns:1fr}
  .rail{position:static;height:auto;border-right:0;border-bottom:1px solid var(--wline);padding:16px}
  .grp{display:none}
  .mnav{display:block}
  .mnav label{font-size:12px;color:var(--wmuted);display:block;margin-bottom:4px}
  .mnav select{width:100%;font:600 15px var(--sans);padding:10px;border-radius:10px;border:1px solid var(--wline);background:var(--ground);color:var(--wink)}
  .stage{position:static}
  .notes{padding-top:0}
}

/* ---------- app (fixed light world, per product locks) ---------- */
.phone{
  --coral:#FF4F5E; --coral-d:#D8304A; --cyan:#2DD4D8; --gold:#C9A227; --gold-soft:#F7F1DE;
  --teal:#0B7B7F; --teal-soft:#E4F4F4; --paper:#F4F0EC; --ink:#171312; --mid:#766C67; --hair:#E4DCD5; --pill:#EAE3DD;
  width:100%;height:min(844px,calc(100dvh - 72px));min-height:620px;border-radius:26px;overflow:hidden;background:var(--paper);color:var(--ink);
  font-family:var(--sans);font-size:15px;line-height:1.4;position:relative;
  box-shadow:0 0 0 1px rgba(18,32,31,.08),0 40px 70px -40px rgba(18,32,31,.55);
}
@media (max-width:820px){.phone{height:760px}}
.scr{height:100%;overflow-y:auto;display:flex;flex-direction:column;overscroll-behavior:contain;scrollbar-width:thin;position:relative}
.phone a{color:inherit}
.phone button{font-family:var(--sans)}
.phone a:focus-visible,.phone button:focus-visible,.phone input:focus-visible,.phone textarea:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
.pb{padding:4px 16px 24px;display:flex;flex-direction:column;gap:18px;flex:1}
.tb{display:flex;align-items:center;gap:8px;padding:14px 16px 10px;position:sticky;top:0;background:var(--paper);z-index:4}
.logo{font-weight:800;letter-spacing:-.04em;font-size:18px;white-space:nowrap;text-decoration:none;background:none;border:0;padding:0;cursor:pointer;color:var(--ink)}
.logo b{color:var(--cyan);font-weight:800}
.tt{font-weight:800;font-size:17px;letter-spacing:-.02em}
.sp{flex:1}
.ib{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;color:var(--ink);background:transparent;border:0;flex:none;cursor:pointer;padding:0}
.ib svg{width:22px;height:22px}
.ib.ghost{visibility:hidden}
.qp{flex:1;min-width:0;height:38px;border-radius:999px;background:#fff;border:1px solid var(--hair);display:flex;align-items:center;gap:8px;padding:0 14px;font-weight:600;font-size:14px;cursor:pointer;color:var(--ink)}
.qp svg{width:16px;height:16px;color:var(--mid);flex:none}
.qp span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cp{height:30px;padding:0 11px;border-radius:999px;background:var(--pill);color:#4C433F;font-size:12.5px;font-weight:700;display:inline-flex;align-items:center;gap:5px;white-space:nowrap;flex:none;border:0;cursor:pointer}
.cp.zero{background:#FCE3E7;color:var(--coral-d)}
.cp.pro{background:var(--gold-soft);color:#8A6D10}

.b{display:flex;align-items:center;justify-content:center;gap:8px;min-height:52px;border-radius:14px;font:700 16px/1.1 var(--sans);text-decoration:none;border:0;cursor:pointer;padding:0 18px;text-align:center}
.b svg{width:19px;height:19px;flex:none}
.b1{background:var(--coral);color:#fff;box-shadow:0 10px 22px -12px rgba(255,79,94,.75)}
.b1:active{transform:translateY(1px)}
.b2{background:#fff;color:var(--ink);border:1.5px solid var(--hair)}
.b2.on{border-color:var(--teal);color:var(--teal);background:var(--teal-soft)}
.b3{background:transparent;color:var(--mid);min-height:44px;font-weight:600;font-size:15px}
.btt{background:#010101;color:#fff}
.bi{width:52px;padding:0;flex:none}
.full-w{width:100%}
.row{display:flex;gap:10px}
.row>.grow{flex:1}
.busy{opacity:.75;pointer-events:none}

.sf{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--hair);border-radius:18px;padding:6px 6px 6px 16px;box-shadow:0 12px 30px -20px rgba(23,19,18,.45)}
.sf>svg{width:20px;height:20px;color:var(--mid);flex:none}
.sf input{flex:1;min-width:0;border:0;background:transparent;font:500 16px var(--sans);color:var(--ink);outline:none;padding:12px 0}
.sf input::placeholder{color:#9A908B}
.sf .go{width:46px;height:46px;border-radius:13px;background:var(--coral);color:#fff;display:grid;place-items:center;border:0;flex:none;cursor:pointer;padding:0}
.sf .go svg{width:20px;height:20px}
.sr{position:absolute;left:-9999px}
.lbl{font-size:13px;font-weight:600;color:var(--mid);margin:0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:36px;padding:0 14px;border-radius:999px;background:#fff;border:1px solid var(--hair);font:600 14px var(--sans);display:inline-flex;align-items:center;gap:6px;cursor:pointer;color:var(--ink)}
.chip.ghost{background:transparent}
.chip:hover{border-color:#CFC4BB}
.stack{display:flex;flex-direction:column;gap:10px}

.vt{position:relative;border-radius:14px;overflow:hidden;background:#d9d2cc center/cover no-repeat;flex:none;border:0;padding:0;display:block;cursor:pointer;width:100%}
.vt .pl{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:50px;height:50px;border-radius:50%;background:rgba(255,255,255,.93);display:grid;place-items:center;color:var(--ink)}
.vt .pl svg{width:18px;height:18px;margin-left:3px}
.vt.sm .pl{width:34px;height:34px}.vt.sm .pl svg{width:13px;height:13px;margin-left:2px}
.vt.playing::after{content:"";position:absolute;left:0;bottom:0;height:4px;background:var(--cyan);animation:play 18s linear forwards}
.vt.playing .pl{opacity:0}
@keyframes play{from{width:0}to{width:100%}}
.br{position:absolute;left:10px;top:10px;background:rgba(255,255,255,.93);border-radius:999px;padding:5px 10px;font-size:12px;font-weight:700;white-space:nowrap;color:var(--ink)}
.br i{font-style:normal;color:var(--mid);font-weight:600}
.du{position:absolute;right:10px;top:10px;background:rgba(23,19,18,.62);color:#fff;border-radius:999px;padding:4px 8px;font-size:11.5px;font-weight:700;font-variant-numeric:tabular-nums}
.sb{position:absolute;left:10px;bottom:10px;background:#fff;border-radius:12px;padding:5px 11px 6px;display:flex;align-items:baseline;gap:6px;box-shadow:0 8px 20px -10px rgba(0,0,0,.4)}
.sb b{color:var(--gold);font-size:24px;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.sb span{font-size:11.5px;color:var(--mid);font-weight:600}
.vt .ex{position:absolute;left:6px;bottom:6px;background:rgba(23,19,18,.62);color:#fff;border-radius:6px;padding:2px 6px;font-size:10.5px;font-weight:700}

.st{display:flex;flex-wrap:wrap;gap:6px 14px;color:var(--mid);font-size:13px;font-weight:600;font-variant-numeric:tabular-nums}
.st span{display:inline-flex;gap:5px;align-items:center}
.st svg{width:15px;height:15px}
.cd{background:#fff;border-radius:22px;padding:10px;display:flex;flex-direction:column;gap:12px;box-shadow:0 12px 30px -24px rgba(23,19,18,.5);border:1px solid rgba(23,19,18,.05)}
.cd .meta{padding:0 6px;display:flex;flex-direction:column;gap:6px}
.hd{font-weight:700;font-size:15.5px}
.hd small{color:var(--mid);font-weight:500;font-size:13px}
.useone{font-size:12px;color:var(--mid);text-align:center;margin:-4px 0 2px}

.box{border-radius:20px;padding:18px 16px;display:flex;flex-direction:column;gap:12px}
.box h3{margin:0;font-size:18px;letter-spacing:-.025em;line-height:1.2}
.box.teal{background:var(--teal-soft)}
.box.white{background:#fff;border:1px solid rgba(23,19,18,.05)}
.eb{font-size:11.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--teal);margin:0}
.eb.c{color:var(--coral-d)} .eb.m{color:var(--mid)}
.phone .q{background:#fff;border-radius:14px;padding:12px 14px;font-weight:700;font-size:16px;line-height:1.35;margin:0}
.ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:11px;counter-reset:n}
.ol li{display:grid;grid-template-columns:26px 1fr;gap:10px;font-size:14.5px;line-height:1.45;counter-increment:n}
.ol li::before{content:counter(n);width:26px;height:26px;border-radius:8px;background:#FCE6EA;color:var(--coral-d);font-weight:800;font-size:13px;display:grid;place-items:center}
.teal .ol li::before{background:#C9E9E9;color:var(--teal)}
.hk{display:flex;flex-direction:column;gap:6px}
.hk button{align-self:flex-start;border:0;background:transparent;color:var(--teal);font:700 12.5px var(--sans);padding:0;cursor:pointer;display:inline-flex;gap:5px;align-items:center}
.hk button svg{width:14px;height:14px}
.chk{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
.chk li{display:grid;grid-template-columns:24px 1fr;gap:10px;font-size:15px;line-height:1.4}
.chk li svg{width:22px;height:22px;color:var(--teal);margin-top:-1px}
.chk li small{display:block;color:var(--mid);font-size:13.5px;margin-top:2px}
.shots{display:flex;flex-direction:column}
.shot{display:grid;grid-template-columns:84px 1fr;gap:10px;padding:11px 0;border-top:1px solid var(--hair);font-size:14.5px;line-height:1.45}
.shot:first-child{border-top:0;padding-top:0}
.tc{font-family:var(--mono);font-size:11.5px;color:var(--coral-d);font-weight:600;padding-top:3px;font-variant-numeric:tabular-nums}
.shotnote{font-size:13.5px;color:var(--mid);background:var(--paper);border-radius:12px;padding:10px 12px;margin:0}

.dock{position:sticky;bottom:0;margin-top:auto;padding:14px 16px 18px;background:linear-gradient(rgba(244,240,236,0),var(--paper) 26%);display:flex;flex-direction:column;gap:10px;z-index:4}
.dock.bar{background:#fff;border-top:1px solid var(--hair);padding-top:12px}

/* overlays */
.toast{position:absolute;left:16px;right:16px;bottom:24px;background:var(--ink);color:#fff;border-radius:14px;padding:12px 14px;font-size:13.5px;display:flex;gap:10px;align-items:flex-start;z-index:30;box-shadow:0 18px 40px -18px rgba(0,0,0,.6)}
.toast svg{width:18px;height:18px;color:var(--cyan);flex:none;margin-top:1px}
.toast button{margin-left:auto;background:none;border:0;color:var(--cyan);font:700 13.5px var(--sans);cursor:pointer;padding:0 0 0 8px;white-space:nowrap}
@media (prefers-reduced-motion: no-preference){.toast{animation:up .22s ease-out}@keyframes up{from{transform:translateY(12px);opacity:0}}}
.scrim{position:absolute;inset:0;background:rgba(23,19,18,.38);z-index:20;border:0;padding:0;cursor:pointer;width:100%}
.sheet{position:absolute;left:0;right:0;bottom:0;background:var(--paper);border-radius:24px 24px 0 0;padding:10px 16px 22px;z-index:21;display:flex;flex-direction:column;gap:6px}
@media (prefers-reduced-motion: no-preference){.sheet{animation:sheet .22s ease-out}@keyframes sheet{from{transform:translateY(40%);opacity:.4}}}
.sheet .grab{width:40px;height:5px;border-radius:9px;background:#D6CDC6;align-self:center;margin-bottom:8px}
.sheet .mi{display:flex;justify-content:space-between;align-items:center;min-height:52px;padding:0 14px;background:#fff;border:0;border-radius:14px;font:600 16px var(--sans);cursor:pointer;color:var(--ink);text-align:left}
.sheet .mi small{color:var(--mid);font-weight:600;font-size:13px}
.sheet .mi.up{background:var(--coral);color:#fff}
.sheet .mi.up small{color:#FFE3E6}

/* home out */
.mos{position:absolute;inset:0 0 auto 0;height:330px;display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:6px;opacity:.7}
.mos div{border-radius:12px;background:center/cover no-repeat}
.mos::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(244,240,236,.15) 0%,rgba(244,240,236,.75) 55%,var(--paper) 100%)}
.hero{position:relative;z-index:1;padding:190px 16px 24px;display:flex;flex-direction:column;gap:18px}
.wm{font-size:30px;font-weight:800;letter-spacing:-.05em;display:flex;align-items:center;gap:8px;margin:0}
.wm::before{content:"";width:14px;height:14px;border-radius:50%;background:var(--cyan);box-shadow:0 0 0 5px rgba(45,212,216,.25)}
.wm b{color:var(--cyan)}
.tag1{font-size:25px;font-weight:800;letter-spacing:-.035em;line-height:1.18;margin:0}
.tag1 span{display:block}
.aud{margin:-8px 0 0;color:var(--mid);font-weight:600;font-size:14px}

/* teaser */
.h1{font-size:28px;font-weight:800;letter-spacing:-.04em;line-height:1.1;margin:0;text-wrap:balance}
.h1 em{font-style:normal;color:var(--coral)}
.sub{margin:0;color:var(--mid);font-size:16px;line-height:1.45}
.fine{font-size:12.5px;color:var(--mid);text-align:center;margin:0}
.lnk{background:none;border:0;padding:0;font:inherit;color:inherit;text-decoration:underline;cursor:pointer}
.sample{background:#fff;border-radius:22px;overflow:hidden;border:1px solid rgba(23,19,18,.06);position:relative}
.sample .band{background:linear-gradient(90deg,#DDF5F5,#FBEFF1);padding:9px 14px;display:flex;justify-content:space-between;align-items:center;font-size:12px;font-weight:700;color:var(--teal)}
.sample .band span{color:var(--mid);font-weight:600}
.sample .in{padding:14px;display:flex;flex-direction:column;gap:12px}
.mini{display:grid;grid-template-columns:92px 1fr;gap:12px;align-items:center}
.bigs{display:flex;align-items:baseline;gap:8px}
.bigs b{font-size:40px;color:var(--gold);font-weight:800;letter-spacing:-.04em;line-height:1;font-variant-numeric:tabular-nums}
.bigs span{color:var(--mid);font-weight:600;font-size:13.5px}
.locked{position:relative}
.locked .blur{filter:blur(5px);opacity:.6;user-select:none;pointer-events:none}
.locked .lk{position:absolute;inset:0;display:grid;place-items:center}
.lk button{background:#fff;border:0;border-radius:999px;padding:9px 14px;display:flex;align-items:center;gap:8px;font:700 13.5px var(--sans);box-shadow:0 10px 24px -12px rgba(0,0,0,.35);cursor:pointer;color:var(--ink)}
.lk svg{width:16px;height:16px}

/* processing */
.proc{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:12px 20px 48px;text-align:center;flex:1;position:relative}
.ring{width:108px;height:108px;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle.p{transition:stroke-dashoffset .9s linear}
.ring .t{position:absolute;inset:0;display:grid;place-content:center;font-weight:800;font-size:24px;font-variant-numeric:tabular-nums;letter-spacing:-.02em;line-height:1}
.ring .t small{font-size:10px;letter-spacing:.1em;color:var(--mid);font-weight:700;margin-top:4px}
.steps{list-style:none;padding:0;margin:0 auto;display:flex;flex-direction:column;gap:10px;text-align:left;width:100%;max-width:260px}
.steps li{display:flex;align-items:center;gap:10px;font-weight:600;font-size:15px}
.steps li i{width:24px;height:24px;border-radius:8px;display:grid;place-items:center;border:1.5px solid var(--hair);background:#fff;flex:none}
.steps li i svg{width:14px;height:14px}
.steps .done i{background:var(--teal-soft);border-color:#B8E3E3;color:var(--teal)}
.steps .now i{border-color:var(--cyan)}
.steps .now i::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--cyan)}
.steps .todo{color:#A39A95}
.exrow{display:flex;gap:8px;justify-content:center}
.exrow .vt{width:96px;aspect-ratio:9/15}
.slow{background:#fff;border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:10px;text-align:left;align-self:stretch;border:1px solid var(--hair)}
.slow p{margin:0;font-size:14px}
.conf{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.conf i{position:absolute;top:-12px;width:9px;height:9px;border-radius:2px}
@media (prefers-reduced-motion: no-preference){.conf i{animation:fall 1.6s ease-in forwards}@keyframes fall{to{transform:translateY(420px) rotate(260deg);opacity:0}}}
@media (prefers-reduced-motion: reduce){.conf{display:none}}
.star{width:84px;height:84px;border-radius:24px;background:linear-gradient(#fff,var(--gold-soft));border:1px solid #EAD9A4;display:grid;place-items:center;color:var(--gold)}
.star svg{width:38px;height:38px}

/* home in */
.bn{display:flex;gap:12px;align-items:center;background:var(--teal-soft);border:1px solid #BDE4E5;border-radius:16px;padding:12px 14px;width:100%;text-align:left;cursor:pointer;font-family:var(--sans);color:var(--ink)}
.bn.ready{background:#FBF5E3;border-color:#EBDDAA}
.dot{width:10px;height:10px;border-radius:50%;background:var(--cyan);box-shadow:0 0 0 5px rgba(45,212,216,.25);flex:none}
@media (prefers-reduced-motion: no-preference){.dot{animation:pulse 1.8s ease-in-out infinite}@keyframes pulse{50%{box-shadow:0 0 0 9px rgba(45,212,216,.08)}}}
.bn .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.bn .tx b{font-size:15px}
.bn .tx small{font-size:12.5px;color:var(--mid)}
.bn .go2{font-weight:700;color:var(--coral-d);font-size:14.5px}
.bn .stg{color:var(--gold);display:grid}
.bn .stg svg{width:22px;height:22px}
.peek{background:#fff;border-radius:18px;padding:12px;display:flex;flex-direction:column;gap:10px}
.peek .hdr{display:flex;justify-content:space-between;align-items:center;font-weight:700}
.peek .hdr button{color:var(--coral-d);background:none;border:0;font:700 14px var(--sans);cursor:pointer;padding:0}
.pk{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pki{display:grid;grid-template-columns:44px 1fr;gap:10px;align-items:center;font-size:13px;line-height:1.3;background:none;border:0;padding:0;text-align:left;cursor:pointer;color:var(--ink);font-family:var(--sans)}
.pki .th{width:44px;height:62px;border-radius:10px;background:center/cover}
.pki b.s{color:var(--gold);font-size:15px}

/* results */
.rh{display:flex;justify-content:space-between;align-items:baseline;gap:10px}

/* detail */
.dh{display:grid;grid-template-columns:138px 1fr;gap:14px;align-items:start}

.infob{width:26px;height:26px;border-radius:50%;border:1.5px solid #E2CF8F;background:var(--gold-soft);color:#8A6D10;display:grid;place-items:center;cursor:pointer;padding:0;flex:none}

.pop{position:absolute;left:0;right:0;top:54px;background:var(--ink);color:#fff;border-radius:12px;padding:10px 12px;font-size:12.5px;line-height:1.4;z-index:5}

.dl{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;margin:0;font-size:13px}

/* share */
.shc{display:grid;grid-template-columns:96px 1fr;gap:14px;background:#fff;border-radius:20px;padding:10px;align-items:center}

/* shared */
.msg{display:grid;grid-template-columns:44px 1fr;gap:12px;align-items:start}

.authbar{display:flex;flex-direction:column;gap:10px}

.authbar .ttl small{color:var(--mid);font-size:12.5px;white-space:nowrap}

/* paid / success / affiliate */
.center{text-align:center;align-items:center}
.price{background:#fff;border-radius:24px;padding:20px 18px 16px;display:flex;flex-direction:column;gap:12px;text-align:center;box-shadow:0 18px 40px -30px rgba(23,19,18,.55)}

/* library */

.li{display:grid;grid-template-columns:64px 1fr auto;gap:12px;align-items:center;background:#fff;border-radius:18px;padding:8px 12px 8px 8px;border:0;text-align:left;cursor:pointer;font-family:var(--sans);color:var(--ink);width:100%}

function isEmptyQ(q){return /night|momtok/i.test(q);}

function resetUi(){S.infoOpen=false;S.menu=false;S.sortSheet=false;S.emailErr="";S.playing=null;}
function go(view,params,opt){
  opt=opt||{};
  if(!opt.replace && S.view) S.stack.push({view:S.view,params:S.params});
  S.view=view;S.params=params||{};resetUi();
  render(true);
}
function back(){
  var prev=S.stack.pop()||{view:"home",params:{}};
  S.view=prev.view;S.params=prev.params;resetUi();
  render(true);
}
function toast(msg){S.toast={msg:msg};renderOverlay();clearTimeout(toast.tm);toast.tm=setTimeout(function(){S.toast=null;renderOverlay();},3000);}

function startSearch(q){
  q=(q||"").trim()||"Lip oil";
  S.query=q;S.draft="";
  if(!S.loggedIn){go("teaser");return;}
  if(S.plan==="free" && S.left-pending().length<=0){go("paid",{reason:"searches"});return;}
  var s={id:S.nextId++,q:q,el:0,need:9,done:false,seen:false,empty:isEmptyQ(q)};
  S.searches.push(s);
  go("proc",{id:s.id});
}
function finish(s){
  if(s.done)return;
  s.done=true;s.el=Math.max(s.el,s.need);
  if(!s.empty && S.plan==="free")S.left=Math.max(0,S.left-1);
  addHistory(s.q,s.empty?0:countFor(s.q));
}
setInterval(function(){
  var changed=false,justDone=[];
  S.searches.forEach(function(s){
    if(s.done)return;
    s.el+=1;
    if(s.el>=s.need){finish(s);justDone.push(s);}
    changed=true;
  });
  if(!changed)return;
  if(S.view==="proc"){
    var cur=findSearch(S.params.id);
    if(cur && cur.done && cur.empty && justDone.indexOf(cur)>-1){cur.seen=true;go("empty",{q:cur.q},{replace:true});return;}
    if(cur && justDone.indexOf(cur)>-1){render(false,true);return;}
    if(cur && !cur.done){updateProc(cur);}
    if(justDone.length)renderChrome();
    return;
  }
  if(justDone.length && (S.view==="home"||S.view==="library"))render(false);
},1000);
function addHistory(q,n){var was=false;S.history=S.history.filter(function(h){if(h.q.toLowerCase()===q.toLowerCase()){was=h.saved;return false;}return true;});S.history.unshift({q:q,when:"Just now",n:n,saved:was});}

/* Every option has to give back a card of the same height, or the page jumps

   card to it. Keyed by width, so it stays right when the window resizes. */
var sampleMinH={},mzNode=null;
function lockSampleHeight(){
  var card=scr.querySelector(".sell .sample");
  if(!card)return;
  var w=card.offsetWidth;
  if(!w)return;
  if(!(w in sampleMinH)){
    if(!mzNode){
      mzNode=document.createElement("div");
      mzNode.className="sell";
      mzNode.setAttribute("aria-hidden","true");
      mzNode.style.cssText="position:absolute;left:-9999px;top:0;visibility:hidden;pointer-events:none";
      document.getElementById("phone").appendChild(mzNode);
    }
    mzNode.style.width=w+"px";
    var max=0;
    S.atab=S.atab||{};var keep=S.atab.sell;
    DEMOS.forEach(function(d){
      var v=vid(d[0]);
      ["hook","why","next"].forEach(function(t){
        S.atab.sell=t;mzNode.innerHTML=sampleCard(v,0,false);
        var hh=mzNode.firstChild.offsetHeight;
        if(hh>max)max=hh;
      });
    });
    S.atab.sell=keep;
    mzNode.innerHTML="";
    sampleMinH[w]=max;
  }
  card.style.minHeight=sampleMinH[w]+"px";
}

function currentKey(){
  if(S.railKey==="questions")return "questions";

  var v=S.view;
  if(S.railKey==="pa-account"&&v==="account")return "pa-account";
  if((S.railKey==="pa-home"&&v==="home"&&!S.menu)||(S.railKey==="pa-menu"&&v==="home"&&S.menu))return S.railKey;
  if(v==="home"){if(!S.loggedIn)return "home-out";if(readyUnseen().length)return "home-ready";if(pending().length)return "home-searching";return "home-in";}
  if(v==="proc"){var s=findSearch(S.params.id);if(s&&s.done)return "proc-ready";if(s&&s.el>=60)return "proc-slow";return "proc";}
  if(v==="results"&&S.params.saved)return "results-saved";
  if(v==="analyzer")return S.tt==="done"?"pa-done":"pa-empty";
  if(v==="story")return "pa-story";
  if(v==="account")return S.plan==="pro"?"account-pro":"account";
  if(v==="detail"&&vid(S.params.v).own)return "own-detail";
  if(v==="paid")return S.params.reason==="videos"?"paid-videos":(S.params.reason==="analyses"?"paid-analyses":"paid");

var scr=document.getElementById("scr"),ovl=document.getElementById("ovl");
var revealObs=null,revealSeen={};
function wireReveal(){
  var items=scr.querySelectorAll(".sell .swrap");
  if(!items.length)return;
  /* a section that has already been seen stays visible, so tapping a chip
     re-renders without flashing the whole page back through the animation */
  if(!("IntersectionObserver" in window)){[].forEach.call(items,function(el){el.classList.add("rv","in");});return;}
  if(revealObs)revealObs.disconnect();
  revealObs=new IntersectionObserver(function(es){
    es.forEach(function(e){if(e.isIntersecting){revealSeen[e.target.getAttribute("data-rv")]=1;e.target.classList.add("in");revealObs.unobserve(e.target);}});
  },{root:scr,rootMargin:"0px 0px -8% 0px",threshold:.08});
  [].forEach.call(items,function(el,i){
    el.setAttribute("data-rv",i);el.classList.add("rv");
    if(revealSeen[i])el.classList.add("in");else revealObs.observe(el);
  });
}

function signIn(q){
  S.loggedIn=true;S.left=3;S.anLeft=3;S.stack=[];S.view="";
  if(q)startSearch(q);else go("home");
}
function act(a,el){
  var d=function(k){return el.getAttribute("data-"+k);};
  switch(a){
    case "back": back(); break;
    case "home": go("home"); break;
    case "menu": S.menu=!S.menu; renderOverlay(); break;
    case "close-menu": S.menu=false; renderOverlay(); break;
    case "fill": S.draft=d("q"); render(false); var fi=scr.querySelector(".sf input"); if(fi){fi.focus();fi.setSelectionRange(fi.value.length,fi.value.length);} break;
    case "chips-refresh": S.chipSet=(S.chipSet+1)%CHIPSETS.length; render(false); break;
    case "edit-search": S.draft=S.query;S.focusSearch=true;go("home"); break;
    case "focus-search": S.draft="";S.focusSearch=true;go("home"); break;
    case "auth": signIn(S.query); break;
    case "auth-shared": signIn((S.sharedQ||"").trim()); break;
    case "view-search": go("proc",{id:+d("id")}); break;
    case "open-ready": var s=findSearch(+d("id"));if(s){s.seen=true;S.query=s.q;go("results",{q:s.q},{replace:S.view==="proc"});} break;
    case "results": S.query=d("q");go("results",{q:d("q"),saved:d("saved")==="1",when:d("when")}); break;
    case "legal": toast("<b>"+d("k")+"</b> page goes here before launch."); break;
    case "refresh-saved":
      if(S.plan==="free"&&S.left<=0){go("paid",{reason:"searches"});break;}
      if(S.plan==="free")S.left--;
      S.params.when="Just now";S.params.refreshed=true;render(false);toast("<b>Refreshed.</b> 1 search used.");break;
    case "empty": go("empty",{q:d("q")}); break;
    case "detail": go("detail",{v:d("v")}); break;
    case "analyze":
    case "top-open":
      var av=d("v");
      if(S.analyzed[av]){go("detail",{v:av});break;}
      if(S.plan==="free"&&S.anLeft<=0){go("paid",{reason:"analyses"});break;}
      S.analyzed[av]=true;if(S.plan==="free")S.anLeft--;go("detail",{v:av}); break;
    case "sell-search": startSearch(d("q")); break;
    case "sell-ex": S.sellV=d("v"); S.sellHook=0; S.sellInfo=false; render(false); break;
    case "sell-hook": S.sellHook=+d("k"); render(false); break;
    case "sell-info": S.sellInfo=!S.sellInfo; render(false); break;
    case "strip": var sp=scr.querySelector(".strip"); if(sp)sp.scrollBy({left:(+d("d"))*Math.round(sp.clientWidth*.8),behavior:"smooth"}); break;
    case "top": go("top"); break;
    case "top-cat": S.topCat=d("k"); render(false); break;
    case "save": var sv=d("v"); if(S.saved[sv])delete S.saved[sv];else S.saved[sv]=true; render(false); if(S.saved[sv])toast("Saved to Library"); break;
    case "share": go("share",{v:d("v")}); break;
    case "play": var k=d("key");S.playing=S.playing===k?null:k;render(false); break;
    case "info": S.infoOpen=!S.infoOpen;render(false); break;
    case "copy-link":
      var cv=d("v"),vv=vid(cv),cl=S.links[cv],cn=S.notes[cv]||"",made="";
      if(!cl){S.links[cv]={note:cn,ver:1};}
      else if(S.editing[cv]&&cn!==cl.note){cl.ver++;cl.note=cn;made="new";}
      S.editing[cv]=false;
      var ct="https://"+linkFor(vv)+(S.links[cv].note.trim()?"\n\n"+S.links[cv].note.trim():"");
      try{navigator.clipboard&&navigator.clipboard.writeText(ct).catch(function(){});}catch(e){}
      render(false); toast(made?"<b>New link copied.</b> Your earlier link still shows its old note.":"<b>Link copied.</b> Anyone with the link can view it."); break;
    case "edit-note": var en=d("v"); S.editing[en]=true; S.notes[en]=S.links[en].note; render(false); var tn=document.getElementById("note"); if(tn){tn.focus();tn.setSelectionRange(tn.value.length,tn.value.length);} break;
    case "paid": go("paid",{reason:"searches"}); break;
    case "paid-videos": go("paid",{reason:"videos"}); break;
    case "upgrade": S.plan="pro";go("pro",{},{replace:true}); break;
    case "affiliate": S.affLink=false;go("affiliate"); break;
    case "reward": S.affReward=d("k"); render(false); break;
    case "aff-link": S.affLink=true;render(false); break;
    case "copy-aff": try{navigator.clipboard&&navigator.clipboard.writeText("https://ugcbreakouts.com/?ref=ivan").catch(function(){});}catch(e){} toast("Link copied"); break;
    case "library": go("library"); break;
    case "account": go("account"); break;
    case "tab": S.libTab=d("k");render(false); break;
    case "logout": jump("home-out"); break;
    case "analyzer": S.menu=false; go("analyzer"); break;
    case "mystory": go("story"); break;
    case "tt-all": S.ttAll=!S.ttAll; render(false); break;
    case "atab": S.atab=S.atab||{}; S.atab[d("key")]=d("k"); render(false); break;
    case "tt-change": S.tt="";render(false);var th=document.getElementById("tt-h");if(th){th.focus();th.select();}break;
    case "sort-open": S.sortSheet=true; renderOverlay(); break;
    case "sort-close": S.sortSheet=false; renderOverlay(); break;
    case "sort": S.sort=d("k"); S.sortSheet=false; render(false); break;
    case "filter": S.filters[d("k")]=!S.filters[d("k")]; render(false); break;
    case "clear-filters": S.filters={}; render(false); break;
    case "save-search": var hh=null;S.history.forEach(function(h){if(h.q===d("q"))hh=h;}); if(hh){hh.saved=!hh.saved;render(false);} break;
  }
}
var phone=document.getElementById("phone");
phone.addEventListener("click",function(e){
  var el=e.target.closest("[data-act]");
  if(!el||!phone.contains(el))return;
  e.preventDefault();
  act(el.getAttribute("data-act"),el);
});
phone.addEventListener("submit",function(e){
  e.preventDefault();
  var f=e.target;
  if(f.matches("[data-form='search']")){startSearch(f.querySelector("input").value);return;}
  if(f.matches("[data-form='tt']")){var hv=(f.querySelector("input").value||"").trim().replace(/^@/,"");if(!hv){f.querySelector("input").focus();return;}S.ttHandle=hv;S.tt="loading";render(false);setTimeout(function(){if(S.tt==="loading"&&S.view==="analyzer"){S.tt="done";go("story");}},1400);return;}
  if(f.matches("[data-form='shared-q']")){var em0=document.getElementById("em-shared");if(em0)em0.focus();return;}
  if(f.matches("[data-form='email']")){
    var em=f.querySelector("input").value.trim();
    if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em)){S.emailErr="Enter an email like you@example.com.";render(false);var ei=scr.querySelector("[data-form='email'] input");if(ei)ei.focus();return;}
    signIn((S.sharedQ||"").trim());
  }
});
phone.addEventListener("input",function(e){
  if(e.target.matches("[data-form='search'] input"))S.draft=e.target.value;
  if(e.target.id==="note"&&!e.target.readOnly)S.notes[e.target.getAttribute("data-v")]=e.target.value;
  if(e.target.matches("[data-form='email'] input"))S.emailDraft=e.target.value;
  if(e.target.id==="q-shared")S.sharedQ=e.target.value;
});

window.addEventListener("message",function(e){
  var m=e.data&&e.data.ub;if(!m||S.view!=="story")return;
  if(m==="close")back();
  if(m==="search"){S.stack=[];S.view="home";S.params={};S.focusSearch=true;render(true);}
});
buildRail();
render(true);
/* deep links: #<screen key> opens that screen, e.g. #account-tt */
(function(){
  var keys=[];RAIL.forEach(function(g){g.items.forEach(function(it){keys.push(it[0]);});});
  function open(){var k=(location.hash||"").slice(1);if(k&&keys.indexOf(k)>-1)jump(k);}
  open();window.addEventListener("hashchange",open);
})();
/* ---------------- full screen mockup ---------------- */
(function(){
  var bar=document.querySelector(".stagebar");if(!bar)return;
  var b=document.createElement("button");b.type="button";b.className="fsbtn";b.setAttribute("aria-pressed","false");
  var ICO='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>';
  function label(on){b.innerHTML=ICO+(on?"Exit full screen":"Full screen");b.setAttribute("aria-pressed",String(on));}
  label(false);
  var ctl=bar.querySelector(".ctl");bar.insertBefore(b,ctl);
  bar.style.gap="8px";
  function set(on){
    document.body.classList.toggle("fs",on);label(on);
    if(on&&document.documentElement.requestFullscreen&&!document.fullscreenElement){document.documentElement.requestFullscreen().catch(function(){});}
    if(!on&&document.fullscreenElement&&document.exitFullscreen){document.exitFullscreen().catch(function(){});}
    window.dispatchEvent(new Event("resize"));
  }
  b.addEventListener("click",function(){set(!document.body.classList.contains("fs"));});
  document.addEventListener("fullscreenchange",function(){if(!document.fullscreenElement&&document.body.classList.contains("fs"))set(false);});
  document.addEventListener("keydown",function(e){
    if(e.target.matches&&e.target.matches("input,textarea,select"))return;
    if(e.key==="Escape"&&document.body.classList.contains("fs"))set(false);
    if((e.key==="f"||e.key==="F")&&!e.metaKey&&!e.ctrlKey)set(!document.body.classList.contains("fs"));
  });
  if(/[?&]fs\b/.test(location.search))set(true);
})();

})();
